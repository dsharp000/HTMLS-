<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Dress-Up Doll ✨</title>
<meta name="description" content="Dress-up doll studio — outfits, hair, scenes, and accessories.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%8E%80%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#ff69b4">
<meta property="og:title" content="✨ Dress-Up Doll ✨">
<meta property="og:description" content="Dress-up doll studio — outfits, hair, scenes, and accessories.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --skin: #F5C2A0;
  --skin-shade: #E8A882;
  --skin-line: #C8956C;
}
body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
  background: linear-gradient(135deg, #ffd6e8 0%, #d6e8ff 50%, #d6ffd6 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 6px;
}
h1 {
  font-size: 1.8em;
  color: #d63384;
  text-shadow: 2px 2px 0 #ffb6d9;
  margin-bottom: 10px;
  letter-spacing: 2px;
}
.game-container {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 820px;
  width: 100%;
}
.doll-panel {
  background: white;
  border-radius: 24px;
  border: 4px solid #ffb6d9;
  padding: 12px;
  box-shadow: 0 8px 32px rgba(214,51,132,0.15);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.controls-panel {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 250px;
  max-width: 270px;
}
.category-row {
  background: white;
  border-radius: 12px;
  border: 2.5px solid #e0e0e0;
  padding: 6px 9px;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.07);
}
.category-row.required { border-color: #ff69b4; }
.cat-icon { font-size: 1.1em; width: 22px; text-align: center; flex-shrink: 0; }
.cat-name { font-size: 0.72em; font-weight: bold; color: #999; min-width: 62px; flex-shrink: 0; }
.required .cat-name { color: #d63384; }
.option-name {
  flex: 1; font-size: 0.72em; color: #333;
  text-align: center; background: #f5f5f5;
  border-radius: 7px; padding: 3px 5px; min-width: 0;
}
.nav-btn {
  background: #ff69b4; color: white; border: none;
  border-radius: 50%; width: 24px; height: 24px;
  font-size: 0.8em; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s; font-weight: bold; flex-shrink: 0;
}
.nav-btn:hover { background: #e55c9e; transform: scale(1.1); }
.nav-btn:active { transform: scale(0.9); }
.section-label {
  font-size: 0.65em; color: #bbb; text-align: center;
  text-transform: uppercase; letter-spacing: 1px; padding: 3px 0 1px;
}

/* Action bar */
.action-row { display: flex; gap: 6px; }
.action-btn {
  flex: 1; border: none; border-radius: 12px; padding: 9px 4px;
  font-family: inherit; font-size: 0.78em; font-weight: bold; color: white;
  cursor: pointer; transition: transform 0.1s, filter 0.15s;
  box-shadow: 0 3px 0 rgba(0,0,0,0.15);
}
.action-btn:hover { filter: brightness(1.08); }
.action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
.action-btn.surprise { background: #9B59B6; }
.action-btn.save { background: #36C796; }
.action-btn.reset-btn { background: #FF9EB5; }

/* Skin swatches */
.swatch-row {
  background: white; border-radius: 12px; border: 2.5px solid #e0e0e0;
  padding: 6px 9px; display: flex; align-items: center; gap: 7px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.07);
}
.swatch {
  width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid transparent;
  cursor: pointer; transition: transform 0.1s, border-color 0.15s; padding: 0;
}
.swatch.sm { width: 17px; height: 17px; border-width: 2px; }
/* swatch rows give their palette the room it needs, wrapping if tight */
.swatch-row .cat-name { min-width: auto; }
.swatch:hover { transform: scale(1.15); }
.swatch.active { border-color: #d63384; transform: scale(1.12); }

/* Doll name */
.doll-name {
  font-family: inherit; font-size: 1em; font-weight: bold; color: #d63384;
  border: none; border-bottom: 2.5px dashed #ffb6d9; background: transparent;
  text-align: center; width: 160px; margin-top: 8px; padding: 3px;
}
.doll-name:focus { outline: none; border-bottom-style: solid; }
.doll-name::placeholder { color: #f0a8cc; }

/* Change feedback */
@keyframes doll-pop { 50% { transform: scale(1.025); } }
.doll-panel svg.pop { animation: doll-pop 0.25s ease; }
@keyframes doll-wiggle {
  25% { transform: rotate(-2deg) scale(1.02); }
  75% { transform: rotate(2deg) scale(1.02); }
}
.doll-panel svg.wiggle { animation: doll-wiggle 0.45s ease; }
</style>
</head>
<body>

<h1>✨ Dress-Up Time! ✨</h1>

<div class="game-container">
  <div class="doll-panel">
    <svg id="doll" viewBox="0 0 200 420" width="210" height="420" xmlns="http://www.w3.org/2000/svg">

      <defs>
        <!-- Shared shading. Both gradients use the default objectBoundingBox
             units, so ANY shape painted with them gets shading that fits its
             own outline - that is what makes new clothes look 3D for free. -->
        <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"    stop-color="#000" stop-opacity="0.30"/>
          <stop offset="0.16" stop-color="#000" stop-opacity="0.07"/>
          <stop offset="0.38" stop-color="#fff" stop-opacity="0.14"/>
          <stop offset="0.62" stop-color="#fff" stop-opacity="0.03"/>
          <stop offset="0.84" stop-color="#000" stop-opacity="0.08"/>
          <stop offset="1"    stop-color="#000" stop-opacity="0.26"/>
        </linearGradient>
        <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"    stop-color="#fff" stop-opacity="0.15"/>
          <stop offset="0.4"  stop-color="#fff" stop-opacity="0"/>
          <stop offset="1"    stop-color="#000" stop-opacity="0.12"/>
        </linearGradient>
        <radialGradient id="gCheek" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#FF8FA8" stop-opacity="0.42"/>
          <stop offset="1" stop-color="#FF8FA8" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- fabric patterns are generated here at runtime -->
      <defs id="dyn-defs"></defs>

      <g id="layer-scene"></g>       <!-- backdrop            -->
      <g id="layer-hair-back"></g>   <!-- hair behind the body -->
      <g id="layer-body"></g>        <!-- skin (built in JS)   -->
      <g id="layer-bottom"></g>      <!-- pants / skirt        -->
      <g id="layer-shirt"></g>       <!-- top + its sleeves    -->
      <g id="layer-jacket"></g>      <!-- outerwear            -->
      <g id="layer-shoes"></g>
      <g id="layer-necklace"></g>
      <g id="layer-bracelet"></g>
      <g id="layer-face"></g>        <!-- eyes / nose / mouth  -->
      <g id="layer-earrings"></g>
      <g id="layer-makeup"></g>
      <g id="layer-hair-front"></g>
      <g id="layer-glasses"></g>
      <g id="layer-hat"></g>

    </svg>
    <input class="doll-name" id="doll-name" placeholder="Name me! ✏️" maxlength="20">
  </div>

  <div class="controls-panel" id="controls"></div>
</div>

<script>
/* ==========================================================================
   DRESS-UP DOLL  ·  modular build
   --------------------------------------------------------------------------
   §1 GEO       the body's measurements. Everything is fitted to these, so
                changing a number here restyles the doll AND all her clothes.
   §2 UTIL      colour + path maths (mirror, smooth ring, tapered tube...)
   §3 FIT       bodice() / sleeve() / trouser() / skirt() / boot()
                -> shapes that automatically hug the body in §1
   §4 STYLES    garment factories: top(), bottom(), outer(), shoes(), jewels
   §5 WARDROBE  >>> THE CLOTHES. Plain data. Edit / add lines here. <<<
   §6 LOOKS     hand-drawn art that isn't fitted to the body (hair, hats,
                glasses, makeup, scenes)
   §7 ENGINE    state, rendering, controls, save/restore
   ========================================================================== */


/* ===== §1 GEO — body measurements ======================================== */
/* Head shapes: half-width of the face at each y, apex first, chin last.
   The skull above y≈56 is nearly identical in every shape so hats, glasses
   and hairlines keep fitting; the cheeks, jaw and chin are what vary.
   Keep half-width at y=96 above ~33 so cheek blush stays on the face. */
const HEADS = [
  { name: "Oval",   tbl: [[34,0],[38,14],[44,24],[52,32],[62,37],[72,39.4],[80,40],
                          [88,38],[96,34.5],[106,28],[114,20],[122,10],[126,0]] },
  { name: "Round",  tbl: [[34,0],[38,15],[44,26],[52,34],[62,38.5],[72,40],[80,41],
                          [88,40.5],[96,38.5],[106,34],[114,26],[121,13],[126,0]] },
  { name: "Heart",  tbl: [[34,0],[38,14],[44,25],[52,33],[62,38.5],[72,41],[80,41.5],
                          [88,37.5],[96,33],[104,22.5],[112,14],[120,6.5],[129,0]] },
  { name: "Square", tbl: [[34,0],[38,15],[44,26],[52,34],[62,38],[72,40],[80,40.5],
                          [88,40],[96,39],[104,37.5],[110,36],[110,36],[117,26],[121,12],[124,0]] },
  { name: "Slim",   tbl: [[34,0],[38,13],[44,22],[52,29],[62,34],[72,36],[80,37],
                          [88,34.5],[96,32],[106,26.5],[116,19],[124,9],[131,0]] }
];

const GEO = {
  head: { cx: 100, cy: 80, rx: 40, ry: 46 },   // nominal box (hats/hair art use it)
  ear:  { cx: 57,  cy: 84, rx: 9,  ry: 11 },
  neck: { top: 110, bottom: 156, w: 13 },

  /* torso half-width at a given y (left side; right side is mirrored) */
  torso: [[146,31],[153,35],[164,35.5],[178,33],[196,30],[212,28.5],
          [230,31],[248,34.5],[262,36],[270,34]],
  shoulderY: 148,
  waistY:    212,
  hipY:      266,

  /* limbs are drawn as tapered tubes along a centre line */
  arm:  { line: [[71,150],[65,170],[56,206],[49,236],[47,258]],
          w:    [11.5, 12.6, 10.4, 8.6, 7.2],
          wrist: [47, 258], hand: [46, 270] },
  leg:  { line: [[81,262],[79,300],[77,340],[76,378]],
          w:    [18, 13.5, 10.6, 8.6] },

  /* left foot outline, toes pointing outward */
  foot: [[68,372],[63,384],[58,395],[57,403],[62,408],
         [76,409],[86,407],[88,398],[85,384],[84,372]],
  ankleY: 376,
  groundY: 409
};


/* ===== §2 UTIL — colour + path maths ===================================== */

/* -- colour -- */
function _hx(c){
  c = c.replace('#','');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  return [parseInt(c.slice(0,2),16), parseInt(c.slice(2,4),16), parseInt(c.slice(4,6),16)];
}
function _rgb(a){
  return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function mix(a, b, t){ const A = _hx(a), B = _hx(b); return _rgb(A.map((v,i) => v + (B[i]-v)*t)); }
const dark = (c, t = 0.22) => mix(c, '#000000', t);
const lite = (c, t = 0.22) => mix(c, '#ffffff', t);

/* -- points & paths -- */
const F = n => Math.round(n * 10) / 10;
const XY = p => F(p[0]) + ',' + F(p[1]);
const mid = (a, b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];

/** closed, smooth outline through a ring of points (corners come out soft;
    repeat a point to sharpen it) */
function ringPath(pts){
  if (pts.length < 3) return '';
  let d = 'M' + XY(mid(pts[pts.length-1], pts[0]));
  for (let i = 0; i < pts.length; i++){
    const c = pts[i], n = pts[(i+1) % pts.length];
    d += ' Q' + XY(c) + ' ' + XY(mid(c, n));
  }
  return d + 'Z';
}
/** open smooth curve through a list of points (seams, hems, folds) */
function curvePath(pts){
  let d = 'M' + XY(pts[0]);
  for (let i = 1; i < pts.length - 1; i++) d += ' Q' + XY(pts[i]) + ' ' + XY(mid(pts[i], pts[i+1]));
  d += ' L' + XY(pts[pts.length-1]);
  return d;
}
/** everything is drawn on the LEFT half, then mirrored — always symmetric */
const flip = s => '<g transform="translate(200,0) scale(-1,1)">' + s + '</g>';
const pair = s => s + flip(s);

/** paint a shape: flat colour + the shared 3D shading */
function paint(d, fill, o = {}){
  let s = '<path d="' + d + '" fill="' + fill + '"/>';
  if (o.shade !== false) s += '<path d="' + d + '" fill="url(#gEdge)"/>';
  if (o.sheen)          s += '<path d="' + d + '" fill="url(#gTop)"/>';
  if (o.line) s += '<path d="' + d + '" fill="none" stroke="' + o.line +
                   '" stroke-width="' + (o.lw || 1.4) + '" opacity="' + (o.lo || 0.55) + '"/>';
  return s;
}
const stroke = (d, c, w, op) =>
  '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w +
  '" opacity="' + (op === undefined ? 1 : op) + '" stroke-linecap="round"/>';

/* -- interpolation & tapered tubes -- */
function interp(tbl, y){
  if (y <= tbl[0][0]) return tbl[0][1];
  for (let i = 1; i < tbl.length; i++){
    if (y <= tbl[i][0]){
      const [y0,w0] = tbl[i-1], [y1,w1] = tbl[i];
      return w0 + (w1 - w0) * (y - y0) / (y1 - y0);
    }
  }
  return tbl[tbl.length-1][1];
}
const halfW = y => interp(GEO.torso, y);

function _cr(p0,p1,p2,p3,t){
  const t2 = t*t, t3 = t2*t;
  const f = (a,b,c,d) => 0.5*((2*b) + (-a+c)*t + (2*a-5*b+4*c-d)*t2 + (-a+3*b-3*c+d)*t3);
  return [f(p0[0],p1[0],p2[0],p3[0]), f(p0[1],p1[1],p2[1],p3[1])];
}
function spline(pts, per = 5){
  const P = [pts[0], ...pts, pts[pts.length-1]], out = [];
  for (let i = 0; i < P.length - 3; i++)
    for (let j = 0; j < per; j++) out.push(_cr(P[i],P[i+1],P[i+2],P[i+3], j/per));
  out.push(pts[pts.length-1].slice());
  return out;
}
function widthAt(ws, u){
  const n = ws.length - 1;
  const f = Math.max(0, Math.min(0.9999, u)) * n, i = Math.floor(f);
  return ws[i] + (ws[i+1] - ws[i]) * (f - i);
}
/** a limb (or a sleeve / trouser leg / boot shaft) as a tapered tube.
    t0/t1 slice it (0 = shoulder or hip, 1 = wrist or ankle);
    pad grows it so clothing sits on top of the skin. */
function tube(line, ws, o = {}){
  const S = spline(line), n = S.length, pad = o.pad || 0;
  const i0 = Math.round((o.t0 !== undefined ? o.t0 : 0) * (n-1));
  const i1 = Math.round((o.t1 !== undefined ? o.t1 : 1) * (n-1));
  const L = [], R = [];
  for (let i = i0; i <= i1; i++){
    const a = S[Math.max(i0, i-1)], b = S[Math.min(i1, i+1)];
    let tx = b[0]-a[0], ty = b[1]-a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = widthAt(ws, i/(n-1)) + pad;
    L.push([S[i][0] - ty*w, S[i][1] + tx*w]);
    R.push([S[i][0] + ty*w, S[i][1] - tx*w]);
  }
  return ringPath(L.concat(R.reverse()));
}
/** point on a centre line at 0..1 — for cuffs, bracelets, hems */
function pointAt(line, t){
  const S = spline(line);
  return S[Math.max(0, Math.min(S.length-1, Math.round(t * (S.length-1))))];
}
/* ring helpers used by shoes */
const centroid = r => r.reduce((a,p) => [a[0]+p[0]/r.length, a[1]+p[1]/r.length], [0,0]);
function growRing(ring, pad, c){
  c = c || centroid(ring);
  return ring.map(([x,y]) => {
    const dx = x-c[0], dy = y-c[1], m = Math.hypot(dx,dy) || 1;
    return [x + dx/m*pad, y + dy/m*pad];
  });
}
function rotRing(ring, deg, o){
  const r = deg*Math.PI/180, c = Math.cos(r), s = Math.sin(r);
  return ring.map(([x,y]) => {
    const dx = x-o[0], dy = y-o[1];
    return [o[0] + dx*c - dy*s, o[1] + dx*s + dy*c];
  });
}

/* -- fabric patterns (built once, reused, and saved into the PNG) --
   NOTE: they are added with innerHTML on the <defs>, which parses in the SVG
   namespace. insertAdjacentHTML does NOT, and would give inert patterns. */
const _pats = new Map();
const _patDefs = [];
function fabric(kind, c, accent){
  const key = kind + '|' + c + '|' + (accent || '');
  if (_pats.has(key)) return _pats.get(key);
  const id = 'pat' + _pats.size;
  const a = accent || lite(c, 0.3);
  let size = 12, body = '';
  if (kind === 'stripes'){
    size = 11;
    body = `<rect width="11" height="11" fill="${c}"/><rect width="11" height="5.5" fill="${a}"/>`;
  } else if (kind === 'dots'){
    size = 14;
    body = `<rect width="14" height="14" fill="${c}"/>
            <circle cx="4" cy="4" r="2.4" fill="${a}"/><circle cx="11" cy="11" r="2.4" fill="${a}"/>`;
  } else if (kind === 'plaid'){
    size = 18;
    body = `<rect width="18" height="18" fill="${c}"/>
            <rect width="18" height="7" fill="${a}" opacity="0.5"/>
            <rect width="7" height="18" fill="${a}" opacity="0.5"/>
            <rect x="11" width="2" height="18" fill="#fff" opacity="0.35"/>
            <rect y="11" width="18" height="2" fill="#fff" opacity="0.35"/>`;
  } else if (kind === 'floral'){
    size = 16;
    const petal = (x,y,r,col) =>
      `<circle cx="${x}" cy="${y-r}" r="${r*0.62}" fill="${col}"/>
       <circle cx="${x+r*0.95}" cy="${y-r*0.3}" r="${r*0.62}" fill="${col}"/>
       <circle cx="${x+r*0.6}" cy="${y+r*0.8}" r="${r*0.62}" fill="${col}"/>
       <circle cx="${x-r*0.6}" cy="${y+r*0.8}" r="${r*0.62}" fill="${col}"/>
       <circle cx="${x-r*0.95}" cy="${y-r*0.3}" r="${r*0.62}" fill="${col}"/>
       <circle cx="${x}" cy="${y}" r="${r*0.42}" fill="#FFD86B"/>`;
    body = `<rect width="16" height="16" fill="${c}"/>` +
           petal(4.5, 4.5, 2.5, a) + petal(12, 11.5, 2.2, lite(a, 0.35)) +
           `<ellipse cx="12" cy="3" rx="2.4" ry="1.1" fill="${lite(c,0.2)}" transform="rotate(-25 12 3)"/>
            <ellipse cx="4" cy="12.5" rx="2.4" ry="1.1" fill="${lite(c,0.2)}" transform="rotate(20 4 12.5)"/>`;
  } else if (kind === 'denim'){
    size = 5;
    body = `<rect width="5" height="5" fill="${c}"/>
            <path d="M0,5 L5,0" stroke="${lite(c,0.16)}" stroke-width="1.1"/>
            <path d="M0,2.5 L2.5,0 M2.5,5 L5,2.5" stroke="${dark(c,0.1)}" stroke-width="0.7"/>`;
  } else if (kind === 'knit'){
    size = 9;
    body = `<rect width="9" height="9" fill="${c}"/>
            <path d="M0,4.5 Q2.25,0 4.5,4.5 Q6.75,9 9,4.5" fill="none"
                  stroke="${dark(c,0.14)}" stroke-width="1.5"/>
            <path d="M0,9 Q2.25,4.5 4.5,9" fill="none" stroke="${lite(c,0.12)}" stroke-width="1"/>`;
  } else {
    body = `<rect width="12" height="12" fill="${c}"/>`;
  }
  _patDefs.push(`<pattern id="${id}" width="${size}" height="${size}" patternUnits="userSpaceOnUse">${body}</pattern>`);
  document.getElementById('dyn-defs').innerHTML = _patDefs.join('');
  const url = 'url(#' + id + ')';
  _pats.set(key, url);
  return url;
}


/* ===== §3 FIT — shapes that hug the body ================================= */

/** The torso piece of any top / dress / jacket.
    pad may be a number or a function of y (used for tank armholes). */
function bodice(o = {}){
  const top    = o.top    !== undefined ? o.top : GEO.shoulderY;
  const bottom = o.bottom !== undefined ? o.bottom : GEO.hipY;
  const padFn  = typeof o.pad === 'function' ? o.pad : () => (o.pad !== undefined ? o.pad : 2.6);
  const neckW  = o.neckW !== undefined ? o.neckW : 15;
  const neckD  = o.neckD !== undefined ? o.neckD : 13;
  const dip    = o.hemDip !== undefined ? o.hemDip : 3;

  const left = [];
  for (let y = top; y < bottom; y += 7) left.push([100 - halfW(y) - padFn(y), y]);
  left.push([100 - halfW(bottom) - padFn(bottom), bottom]);
  const right = left.map(p => [200 - p[0], p[1]]).reverse();

  const ring = [
    ...left,
    [100, bottom + dip],
    ...right,
    [100 + neckW, top + 2],
    [100, top + neckD], [100, top + neckD],   // doubled = a deeper neckline
    [100 - neckW, top + 2]
  ];
  return ringPath(ring);
}
/** the collar line that matches a bodice's neckline */
const necklineCurve = (neckW, neckD, top = GEO.shoulderY) =>
  curvePath([[100-neckW, top+3], [100, top+neckD+2.5], [100+neckW, top+3]]);

/* sleeves / trousers / boot shafts are all just slices of a limb tube */
const sleeve  = (t1, pad = 3.2, t0 = 0) => tube(GEO.arm.line, GEO.arm.w, {t0, t1, pad});
const trouser = (t1, pad = 2.6, t0 = 0) => tube(GEO.leg.line, GEO.leg.w, {t0, t1, pad});

/** a skirt: flares out from the waist. Returns the path plus the widths so
    the caller can add pleats/ruffles that follow the flare. */
function skirt(o = {}){
  const top    = o.top !== undefined ? o.top : 250;
  const bottom = o.bottom !== undefined ? o.bottom : 340;
  const wTop   = halfW(top) + (o.pad !== undefined ? o.pad : 2.5);
  const wBot   = wTop + (o.flare !== undefined ? o.flare : 24);
  const at = t => wTop + (wBot - wTop) * Math.pow(t, o.curve || 1.4);
  const left = [];
  for (let i = 0; i <= 7; i++){
    const t = i/7;
    left.push([100 - at(t), top + (bottom - top) * t]);
  }
  const right = left.map(p => [200 - p[0], p[1]]).reverse();
  const ring = [...left, [100, bottom + (o.hemDip !== undefined ? o.hemDip : 7)], ...right,
                [100, top - 2]];
  return { d: ringPath(ring), wTop, wBot, top, bottom, at };
}

/* ---------- head & hair fitting ----------
   Hair is built FROM the head outline, so it can never leave a bald patch and
   it re-fits itself when the face shape changes. */
const headTbl   = () => HEADS[state.head || 0].tbl;
const headHalfW = y => interp(headTbl(), y);

/** the face outline for the chosen head shape */
function headRing(pad = 0){
  const t = headTbl();
  const right = t.map(([y, w]) => [100 + (w > 0 ? w + pad : 0), y]);
  const left  = right.slice(1, -1).map(([x, y]) => [200 - x, y]).reverse();
  return ringPath(right.concat(left));
}
/** how far out hair hangs once it is past the widest part of the head */
const hairFall = vol => headHalfW(80) + vol;

/** the hair lying on the skull: hugs the head, with `vol` of thickness */
function capRing(o = {}){
  const v = o.vol !== undefined ? o.vol : 5;
  const hl = o.hairline !== undefined ? o.hairline : 56;
  const low = o.temple !== undefined ? o.temple : 86;
  const side = [];
  [low, 80, 72, 64, 56, 48, 44, 40].forEach(y => {
    if (y <= low) side.push([100 - (headHalfW(y) + v), y]);
  });
  const apex  = [100, 34 - v * 1.5];
  const other = side.map(([x, y]) => [200 - x, y]).reverse();
  /* the hairline: low at the temples, arcing up across the forehead */
  const brow = [[100 + 26, 64], [100 + 13, hl + 4], [100, hl], [100 - 13, hl + 4], [100 - 26, 64]];
  return ringPath([...side, apex, ...other, ...brow]);
}

/** the mass of hair hanging behind the head, down to y = o.len */
function backMass(o){
  const v = o.vol !== undefined ? o.vol : 5, spread = o.spread !== undefined ? o.spread : 5;
  const side = [];
  [40, 48, 56, 64, 72, 80, 88, 96, 106].forEach(y => side.push([100 - (headHalfW(y) + v + 1), y]));
  const fall = hairFall(v);
  for (let i = 1; i <= 4; i++){
    const t = i / 4;
    side.push([100 - (fall + spread * t), 108 + (o.len - 108) * t]);
  }
  const other = side.map(([x, y]) => [200 - x, y]).reverse();
  return ringPath([...side, [100, o.len + (o.hemDip !== undefined ? o.hemDip : 7)],
                   ...other, [100, 34 - v * 1.6]]);
}

/** a face-framing strand: follows the skull, then hangs straight down */
function sideStrand(o){
  const v = o.vol !== undefined ? o.vol : 5;
  const w = o.sideW !== undefined ? o.sideW : 8, len = o.sideLen || 140;
  const fall = hairFall(v);
  const xAt = y => (y <= 80 ? headHalfW(y) + v : fall);
  const outer = [], inner = [];
  const step = Math.max(8, (len - 50) / 7);
  for (let y = 50; y <= len; y += step){
    const t = (y - 50) / (len - 50);
    const x = 100 - xAt(y);
    outer.push([x, y]);
    inner.push([x + w * (1 - 0.4 * t), y]);
  }
  return ringPath(outer.concat(inner.reverse()));
}

/** A curly mass. Uniform circles read as a sheep and a smooth outline reads
    as a hood, so the edge is built from irregular lobes: each lobe is a
    valley + a doubled peak, with the radius varied per lobe. Drawn behind the
    head, so the face paints over it. */
function curlyMass(o){
  const v = o.vol !== undefined ? o.vol : 6;
  const puff = o.puff !== undefined ? o.puff : 9;
  const len = o.len || 150;
  const R = headHalfW(80) + v + puff;
  const lobes = o.lobes || 12;
  const cy = 72;
  /* valley points around the head, at irregular radii */
  const pts = [];
  for (let i = 0; i < lobes; i++){
    const a = (i / lobes) * 2 * Math.PI;
    const rr = R * (0.9 + 0.07 * Math.sin(i * 2.4) + 0.04 * Math.sin(i * 5.1 + 1));
    const y = cy - Math.cos(a) * rr * 0.96;
    pts.push([100 + Math.sin(a) * rr, y > cy ? cy + (y - cy) * ((len - cy) / (R * 0.96)) : y]);
  }
  /* bulge an arc outward between each pair: round clumps, not spikes */
  let d = 'M' + XY(pts[0]);
  for (let i = 0; i < lobes; i++){
    const a = pts[i], b = pts[(i + 1) % lobes];
    const chord = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const r = chord * (0.62 + 0.1 * Math.abs(Math.sin(i * 1.9)));
    d += ` A${F(r)},${F(r)} 0 0 1 ${XY(b)}`;
  }
  return d + 'Z';
}
/** true where hair belongs: above the hairline, or beside the face */
function inHair(x, y, o){
  if (y < (o.hairline !== undefined ? o.hairline : 58) - 3) return true;
  return Math.abs(x - 100) > headHalfW(y) + 1;
}
/** short S-strokes that read as coils */
function coils(c, o, spots, r, w, op){
  const dk = dark(c, 0.38), lt = lite(c, 0.26);
  let s = '';
  spots.forEach(([x, y, k], i) => {
    const rr = r * (k || 1);
    s += stroke(`M${F(x-rr)},${F(y)} Q${F(x-rr*0.45)},${F(y-rr*1.15)} ${F(x)},${F(y)}` +
                ` Q${F(x+rr*0.45)},${F(y+rr*1.15)} ${F(x+rr)},${F(y)}`,
                i % 3 === 0 ? lt : dk, w, op);
  });
  return s;
}
/** coil positions inside the mass, never on the face */
function coilSpots(o, band){
  const v = o.vol !== undefined ? o.vol : 6;
  const R = (headHalfW(80) + v + (o.puff !== undefined ? o.puff : 9));
  const out = [];
  const n = band === 'edge' ? 21 : 16;
  for (let i = 0; i < n; i++){
    const t = n === 1 ? 0.5 : i / (n - 1);
    const a = (-1 + 2 * t) * Math.PI * 0.94;
    const f = band === 'edge' ? 0.9 + 0.07 * Math.sin(a * 3.1)
                              : 0.62 + 0.12 * Math.sin(a * 2.3 + 1.4);
    const rr = R * f;
    const x = 100 + Math.sin(a) * rr, y = 72 - Math.cos(a) * rr * 0.96;
    if (y > 138 || !inHair(x, y, o)) continue;
    out.push([x, y, 0.78 + 0.3 * Math.abs(Math.sin(a * 2.7))]);
  }
  return out;
}

/** the bare foot outline, optionally padded (shoes) or tilted (heels) */
function footShape(o = {}){
  let ring = GEO.foot;
  if (o.tilt) ring = rotRing(ring, o.tilt, o.pivot || [59, 405]);
  if (o.pad)  ring = growRing(ring, o.pad);
  return ringPath(ring);
}


/* ===== §4 STYLES — garment factories ====================================
   Every maker takes one plain options object and returns SVG.
   To invent a new garment: add a maker here, then use its name as
   `style:` in the WARDROBE below.                                          */

const SLEEVE_T = { none: 0, cap: 0.16, short: 0.34, elbow: 0.55, three: 0.7, long: 0.93 };
const NECK     = { crew:{w:15,d:12}, high:{w:12,d:6},  scoop:{w:19,d:19},
                   v:{w:16,d:27},    boat:{w:22,d:8},  square:{w:17,d:16} };
const HEM      = { crop: 214, waist: 244, hip: 264, tunic: 292 };

/* soft creases so fabric doesn't look like flat vinyl */
function creases(c, y0, y1){
  const d = dark(c, 0.3);
  return pair(
    stroke(curvePath([[78,y0+6],[83,y0+18],[79,y1-6]]), d, 2, 0.16) +
    stroke(curvePath([[90,y0+22],[93,y0+34],[90,y1-4]]), d, 1.6, 0.11)
  );
}

const STYLES = {

  /* ---------- TOPS ---------- */
  shirt: {
    top(o){
      const c    = o.color;
      const fill = o.pattern ? fabric(o.pattern, c, o.accent) : c;
      const dk   = dark(c, 0.26);
      const bot  = HEM[o.length || 'hip'] || o.length;
      const nk   = NECK[o.neck || 'crew'];
      const slv  = o.sleeve || 'short';
      const t1   = SLEEVE_T[slv];

      /* sleeveless tops pull in at the shoulder so the arm stays free */
      const pad = slv === 'none'
        ? y => (y < 182 ? -7 + (y - GEO.shoulderY) * 0.28 : 2.6)
        : 2.8;

      let s = '';
      if (t1) s += pair(paint(sleeve(t1, 3.2), fill, {sheen: true}));
      s += paint(bodice({bottom: bot, pad, neckW: nk.w, neckD: nk.d, hemDip: o.hemDip}), fill, {sheen: true});

      /* collar + shoulder seams */
      s += stroke(necklineCurve(nk.w, nk.d), dk, 2.2, 0.75);
      if (o.collarBand) s += stroke(necklineCurve(nk.w + 1.5, nk.d + 3.5), dk, 3.5, 0.55);
      if (t1) s += pair(stroke(curvePath([[100 - halfW(154) - 2, 154],
                                          [100 - halfW(168) - 4, 172]]), dk, 1.6, 0.3));
      /* cuffs, hem band, buttons, motif */
      if (t1 >= SLEEVE_T.long) s += pair(paint(sleeve(0.97, 3.6, 0.86), dk, {shade: false}));
      if (o.ribbed){
        s += paint(bodice({top: bot - 12, bottom: bot, pad: 2.9, neckW: 0, neckD: 0, hemDip: 3}), dk, {shade: false});
      }
      if (o.buttons){
        for (let i = 0; i < o.buttons; i++){
          const y = GEO.shoulderY + nk.d + 12 + i * ((bot - GEO.shoulderY - nk.d - 18) / o.buttons);
          s += `<circle cx="100" cy="${F(y)}" r="2.4" fill="${dk}"/>
                <circle cx="99.3" cy="${F(y-0.7)}" r="0.9" fill="#fff" opacity="0.45"/>`;
        }
        s += stroke('M100,' + F(GEO.shoulderY + nk.d) + ' L100,' + F(bot - 4), dk, 1, 0.4);
      }
      if (o.motif) s += `<text x="100" y="205" font-size="26" text-anchor="middle">${o.motif}</text>`;
      s += creases(c, GEO.shoulderY + nk.d, bot);
      /* the shadow the top casts on whatever is underneath */
      s += stroke(curvePath([[100 - halfW(bot) - 2, bot], [100, bot + 4], [100 + halfW(bot) + 2, bot]]),
                  '#000', 3.5, 0.14);
      return s;
    }
  },

  /* ---------- HAIR ----------
     One factory drives every hairstyle. It builds the cap from the current
     head shape, so hair re-fits itself and never leaves a bald patch.      */
  hair: {
    hair(o){
      /* colour comes from the palette swatch, not the style, so any style
         can be any colour (o.color is only a fallback) */
      const c = hairColor() || o.color, dk = dark(c, 0.3), lt = lite(c, 0.3);
      const v = o.vol !== undefined ? o.vol : 5;
      const apexY = 34 - v * 1.5;
      let back = '', front = '';

      /* --- behind the head --- */
      if (o.len)    back += paint(backMass(o), c, {sheen: true});
      if (o.curls){
        back += paint(curlyMass(o), c, {sheen: true});
        back += coils(c, o, coilSpots(o, 'edge'), 6, 2.2, 0.5);
        back += coils(c, o, coilSpots(o, 'in'),   5.2, 1.9, 0.36);
      }
      if (o.ponytail){
        const tail = tube([[122,40],[145,64],[150,100],[139,134],[129,158]], [11,13,12,9,5]);
        back += paint(tail, c, {sheen: true});
        back += stroke(curvePath([[136,66],[146,96],[139,126]]), lt, 2, 0.35);
      }

      /* --- the cap on the skull --- */
      front += paint(capRing({vol: v, hairline: o.hairline, temple: o.temple}), c, {sheen: true});
      if (o.curls){
        /* texture on the cap (above the hairline only) + a loose curl at each temple */
        front += coils(c, o, coilSpots({...o, puff: Math.max(0, (o.puff || 9) - 11)}, 'edge'), 5, 1.9, 0.4);
        const hl = o.hairline !== undefined ? o.hairline : 60;
        const fx = headHalfW(hl + 8) + v;
        front += stroke(`M${F(100-fx+2)},${F(hl+5)} Q${F(100-fx-5)},${F(hl+13)} ${F(100-fx+3)},${F(hl+20)}`, c, 3.4, 0.95);
        front += stroke(`M${F(100+fx-2)},${F(hl+7)} Q${F(100+fx+6)},${F(hl+16)} ${F(100+fx-3)},${F(hl+23)}`, c, 3.4, 0.95);
      }

      /* --- face-framing strands --- */
      if (o.sides) front += pair(paint(sideStrand(o), c, {sheen: true}));

      /* --- braids / buns / wisps --- */
      if (o.braids){
        const bx = 100 - (hairFall(v) + 1);
        let b = '';
        for (let i = 0; i < 7; i++){
          const y = 104 + i * 13, r = 9.6 - i * 0.55;
          b += `<ellipse cx="${F(bx + (i % 2 ? 2 : -2))}" cy="${y}" rx="${F(r)}" ry="${F(r * 0.92)}"
                         fill="${i % 2 ? lite(c, 0.12) : c}"/>`;
          b += stroke(`M${F(bx-r*0.85)},${F(y+2.5)} L${F(bx+r*0.85)},${F(y-2.5)}`, dark(c,0.3), 1.3, 0.32);
        }
        const ty = 104 + 7 * 13;
        b += `<ellipse cx="${F(bx)}" cy="${F(ty - 5)}" rx="6.5" ry="3.4" fill="${o.tie || '#FF69B4'}"/>`;
        b += stroke(`M${F(bx-3)},${F(ty)} Q${F(bx-5)},${F(ty+9)} ${F(bx-2)},${F(ty+15)}`, c, 2.4, 0.9) +
             stroke(`M${F(bx+2)},${F(ty)} Q${F(bx+4)},${F(ty+9)} ${F(bx+1)},${F(ty+15)}`, c, 2.4, 0.9);
        front += pair(b);
      }
      const bun = (cx, cy, r) =>
        `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>
         <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gEdge)"/>
         <path d="${curvePath([[cx-r*0.6,cy-r*0.3],[cx,cy-r*0.75],[cx+r*0.6,cy-r*0.3]])}"
               fill="none" stroke="${lt}" stroke-width="2" opacity="0.45"/>` +
        (o.tie ? `<ellipse cx="${cx}" cy="${cy+r-1}" rx="${F(r*0.6)}" ry="3" fill="${o.tie}"/>` : '');
      if (o.bun)  front += bun(100, F(apexY - 6), 14);
      if (o.buns2) front += pair(bun(74, F(apexY + 4), 11));
      if (o.waves){
        const wx = 100 - hairFall(v) + 5;
        front += pair(stroke(curvePath([[wx+1,92],[wx-4,124],[wx+2,156],[wx-3,188]]), lt, 2.6, 0.32));
        front += pair(stroke(curvePath([[wx+9,100],[wx+4,132],[wx+10,164]]), dark(c,0.22), 2.2, 0.22));
      }
      if (o.wisps){
        const fx = 100 - hairFall(v);
        front += pair(stroke(`M${F(fx+2)},${F(o.sideLen-14)} Q${F(fx-3)},${F(o.sideLen-4)} ${F(fx+3)},${F(o.sideLen+4)}`, c, 2.6, 0.9));
      }

      /* --- parting and crown gloss --- */
      const px = 100 + (o.part || 0) * 26;
      front += stroke(`M${F(px)},${F(apexY + 3)} L${F(100 + (o.part || 0) * 16)},${F((o.hairline || 56) + 2)}`, dk, 1.6, 0.45);
      front += stroke(curvePath([[100-24, apexY+13], [100, apexY+7], [100+24, apexY+13]]), lt, 4, 0.4);
      return { 'hair-back': back, 'hair-front': front };
    }
  },

  /* ---------- BOTTOMS ---------- */
  bottom: {
    pants(o){
      const c    = o.color;
      const fill = o.pattern ? fabric(o.pattern, c, o.accent) : c;
      const dk   = dark(c, 0.3);
      const len  = o.length !== undefined ? o.length : 1;
      const pad  = o.slim ? 1.6 : 2.8;
      let s = pair(paint(trouser(len, pad), fill, {sheen: true}));
      /* waistband */
      s += paint(bodice({top: 250, bottom: 268, pad: pad + 0.4, neckW: 0, neckD: 0, hemDip: 0}), dk, {shade: false});
      s += stroke('M' + (100 - halfW(258) - pad) + ',258 L' + (100 + halfW(258) + pad) + ',258', lite(c, 0.25), 1, 0.3);
      /* seams and creases, trimmed to wherever this leg actually ends
         (so shorts and capris don't leave stitching on bare skin) */
      const yHem = pointAt(GEO.leg.line, len)[1] - 5;
      const upto = pts => pts.filter(p => p[1] < yHem);
      const seam = (pts, col, w, op) => (upto(pts).length > 1 ? pair(stroke(curvePath(upto(pts)), col, w, op)) : '');
      s += seam([[99, 272], [95, 292], [96, 330]], dk, 1.6, 0.4);          // inseam
      s += seam([[68, 318], [78, 322], [87, 317]], dk, 1.6, 0.16);         // knee
      if (o.stitch){
        s += seam([[70, 274], [68, 320], [67, 360]], o.stitch, 1, 0.55);
        s += seam([[92, 274], [89, 320], [87, 360]], o.stitch, 1, 0.4);
        s += pair(stroke('M62,270 Q72,272 74,282 L62,282', o.stitch, 1, 0.5));   // pocket
      }
      if (o.cuff) s += pair(paint(trouser(len, pad + 1.1, len - 0.07), dk, {shade: false}));
      if (o.sparkle) s += pair(`<text x="66" y="300" font-size="9" opacity="0.75">✨</text>
                                <text x="74" y="338" font-size="8" opacity="0.6">⭐</text>`);
      return s;
    },
    skirt(o){
      const c    = o.color;
      const fill = o.pattern ? fabric(o.pattern, c, o.accent) : c;
      const dk   = dark(c, 0.3);
      const sk   = skirt({top: 250, bottom: o.hem || 344, flare: o.flare !== undefined ? o.flare : 26});
      let s = paint(sk.d, fill, {sheen: true});
      /* waistband */
      s += paint(bodice({top: 250, bottom: 266, pad: 2.6, neckW: 0, neckD: 0, hemDip: 0}), dk, {shade: false});
      /* pleats follow the flare, so they stay right if the skirt changes */
      if (o.pleats){
        for (let f = -0.78; f < 0.9; f += 0.26){
          if (Math.abs(f) < 0.05) continue;
          s += stroke('M' + F(100 + f*sk.wTop) + ',' + (sk.top + 14) +
                      ' L' + F(100 + f*sk.wBot) + ',' + F(sk.bottom + 5 - Math.abs(f)*4),
                      f < 0 ? dk : lite(c, 0.22), 2, 0.3);
        }
      }
      /* ruffle tiers: a wave drawn across the (already flared) skirt */
      if (o.ruffles){
        for (let k = 1; k <= o.ruffles; k++){
          const t = k / (o.ruffles + 0.5);
          const y = sk.top + (sk.bottom - sk.top) * t, w = sk.at(t);
          const pts = [];
          for (let i = 0; i <= 10; i++){
            const x = 100 - w + (2*w) * (i/10);
            pts.push([x, y + (i % 2 ? 5.5 : 0)]);
          }
          s += paint(ringPath([...pts, [100 + w, y - 7], [100 - w, y - 7]]), lite(c, 0.3), {shade: false});
          s += stroke(curvePath(pts), dk, 1.4, 0.22);
        }
      }
      if (o.motifs){
        const m = o.motifs;
        [[72,300,9],[100,288,10],[128,302,9],[84,332,8],[116,338,8],[100,364,9]].forEach(([x,y,r]) => {
          s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${m}" opacity="0.9"/>
                <circle cx="${x}" cy="${y}" r="${r*0.45}" fill="#FFD86B"/>`;
        });
      }
      s += stroke(curvePath([[100 - sk.wBot + 3, sk.bottom + 1], [100, sk.bottom + 8],
                             [100 + sk.wBot - 3, sk.bottom + 1]]), dk, 2, 0.35);
      return s;
    }
  },

  /* ---------- OUTERWEAR ---------- */
  jacket: {
    none(){ return ''; },
    /** open jacket: two front panels with a gap, so the top shows through */
    coat(o){
      const c    = o.color;
      const fill = o.pattern ? fabric(o.pattern, c, o.accent) : c;
      const dk   = dark(c, 0.28);
      const bot  = o.length || 262;
      const gap  = o.gap !== undefined ? o.gap : 6;
      const pad  = o.pad !== undefined ? o.pad : 6;

      /* one front panel, built from the same silhouette as everything else */
      const side = [];
      for (let y = GEO.shoulderY; y < bot; y += 7) side.push([100 - halfW(y) - pad, y]);
      side.push([100 - halfW(bot) - pad, bot]);
      const panel = ringPath([
        ...side,
        [100 - gap - 3, bot + 2],
        [100 - gap, 196],
        [100 - (o.lapel ? 3 : gap + 1), GEO.shoulderY + 16],
        [100 - 15, GEO.shoulderY + 2]
      ]);

      let s = pair(paint(sleeve(o.sleeve || 0.92, pad - 0.4), fill, {sheen: true}));
      s += pair(paint(panel, fill, {sheen: true}));
      if (o.lapel){
        const lap = ringPath([[100-15, GEO.shoulderY+3], [100-24, GEO.shoulderY+8],
                              [100-gap-2, 192], [100-gap, 196], [100-3, GEO.shoulderY+18]]);
        s += pair(paint(lap, dark(c, 0.14), {shade: false, line: dk, lw: 1, lo: 0.5}));
      }
      if (o.hood){
        /* the hood is folded down behind the neck, not pulled over the face */
        const hood = ringPath([[68,160],[64,146],[72,137],[86,134],[100,133],[114,134],[128,137],
                               [136,146],[132,160],[116,166],[100,167],[84,166]]);
        s += paint(hood, dark(c, 0.12), {sheen: true});
        s += stroke(curvePath([[78,152],[100,161],[122,152]]), dk, 2, 0.5);
        s += pair(stroke('M95,156 L91,182', lite(c, 0.55), 2.2, 0.95)) +
             `<circle cx="91" cy="183" r="2.2" fill="${lite(c,0.55)}"/>
              <circle cx="109" cy="183" r="2.2" fill="${lite(c,0.55)}"/>`;
      }
      if (o.zip) s += stroke('M100,' + (GEO.shoulderY + 18) + ' L100,' + (bot - 2), dk, 2, 0.7);
      if (o.buttons){
        for (let i = 0; i < o.buttons; i++)
          s += `<circle cx="${100 - gap - 1}" cy="${186 + i*17}" r="2.3" fill="${lite(c,0.3)}"/>`;
      }
      if (o.pockets){   // patch pocket with a flap (a 4-point ring would smooth into an oval)
        s += pair(`<path d="M63,213 L81,213 L80,229 Q72,232 64,229 Z" fill="${dark(c,0.15)}"/>` +
                  stroke('M62.5,213 L81.5,213', dk, 1.6, 0.65));
      }
      if (o.belt){
        s += paint(bodice({top: 200, bottom: 218, pad: pad + 0.6, neckW: 0, neckD: 0, hemDip: 0}),
                   o.belt, {sheen: true});
        s += `<rect x="90" y="199" width="20" height="20" rx="3" fill="${lite(o.belt,0.2)}"/>`;
      }
      if (o.cuffs) s += pair(paint(sleeve(0.96, pad + 0.4, 0.84), dk, {shade: false}));
      return s;
    }
  },

  /* ---------- SHOES ---------- */
  shoes: {
    none(){ return ''; },
    sneaker(o){
      const c = o.color, dk = dark(c, 0.25), sole = o.sole || '#F2F2F2';
      let s = paint(footShape({pad: 3}), c, {sheen: true});
      s += paint(ringPath(growRing(GEO.foot, 3).filter(p => p[1] > 396)
                  .concat([[88,404],[57,404]])), sole, {shade: false});
      s += stroke(curvePath([[62,382],[72,378],[84,378]]), '#fff', 1.6, 0.75);
      s += stroke(curvePath([[63,388],[74,384],[85,385]]), '#fff', 1.6, 0.6);
      s += stroke(curvePath([[60,398],[74,401],[89,399]]), dk, 1.6, 0.5);
      s += `<path d="M84,374 Q78,388 63,392" fill="none" stroke="${dk}" stroke-width="2.4" opacity="0.55"/>`;
      return pair(s);
    },
    boot(o){
      const c = o.color, dk = dark(c, 0.3);
      let s = paint(tube(GEO.leg.line, GEO.leg.w, {t0: o.shaft || 0.55, t1: 1, pad: 3.2}), c, {sheen: true});
      s += paint(footShape({pad: 3.4}), c, {sheen: true});
      s += paint(ringPath(growRing(GEO.foot, 3.4).filter(p => p[1] > 398)
                  .concat([[89,406],[56,406]])), dk, {shade: false});
      const top = pointAt(GEO.leg.line, o.shaft || 0.55);
      s += stroke('M' + F(top[0]-12) + ',' + F(top[1]) + ' L' + F(top[0]+12) + ',' + F(top[1]), lite(c, 0.35), 3, 0.8);
      s += stroke(curvePath([[66,358],[76,361],[87,358]]), dk, 1.6, 0.5);
      if (o.laces) s += stroke('M69,346 L69,388', lite(c, 0.45), 2, 0.85);
      return pair(s);
    },
    heel(o){
      const c = o.color, dk = dark(c, 0.3);
      const tilt = -11, pivot = [58, 404];
      let s = paint(footShape({pad: 2.2, tilt, pivot}), c, {sheen: true});
      const heelPt = rotRing(growRing(GEO.foot, 2.2), tilt, pivot).slice(6, 8);
      s += paint(ringPath([[heelPt[0][0]-3, heelPt[0][1]-2], [heelPt[0][0]+1, heelPt[0][1]-1],
                           [heelPt[0][0]+1, 409], [heelPt[0][0]-3.5, 409]]), dk, {shade: false});
      s += stroke(curvePath([[62,378],[72,372],[83,371]]), lite(c, 0.35), 2, 0.55);
      if (o.strap) s += stroke(curvePath([[60,384],[73,379],[85,381]]), lite(c, 0.5), 2.4, 0.9);
      return pair(s);
    },
    sandal(o){
      const c = o.color, dk = dark(c, 0.3);
      let s = paint(ringPath(growRing(GEO.foot, 1.5).filter(p => p[1] > 396)
                    .concat([[88,404],[57,404]])), c, {sheen: true});
      s += stroke(curvePath([[59,396],[72,390],[86,394]]), c, 3, 0.95);
      s += stroke(curvePath([[62,388],[73,383],[84,387]]), c, 2.4, 0.9);
      s += stroke('M70,384 L69,400', c, 2, 0.9) + stroke('M78,382 L79,400', c, 2, 0.9);
      s += stroke(curvePath([[58,404],[74,407],[88,404]]), dk, 2, 0.5);
      return pair(s);
    },
    flat(o){
      const c = o.color, dk = dark(c, 0.3);
      let s = paint(footShape({pad: 2}), c, {sheen: true});
      s += paint(ringPath(growRing(GEO.foot, 2).filter(p => p[1] > 400)
                  .concat([[88,405],[57,405]])), dk, {shade: false});
      s += stroke(curvePath([[66,375],[75,371],[85,373]]), lite(c, 0.4), 2, 0.6);
      if (o.bow) s += `<path d="M68,381 Q62,375 68,372 Q73,376 76,380 Z" fill="${lite(c,0.45)}"/>
                       <path d="M76,380 Q80,372 86,375 Q84,380 79,383 Z" fill="${lite(c,0.45)}"/>
                       <circle cx="76.5" cy="380" r="2.1" fill="${dk}"/>`;
      return pair(s);
    }
  },

  /* ---------- JEWELLERY (anchored to the body, so it always fits) -------- */
  necklace: {
    none(){ return ''; },
    beads(o){
      const drop = o.drop || 16, n = o.count || 9;
      const a = [100 - 20, 152], b = [100, 152 + drop*1.6], c = [100 + 20, 152];
      let s = '';
      for (let i = 0; i < n; i++){
        const t = i/(n-1), u = 1-t;
        const x = u*u*a[0] + 2*u*t*b[0] + t*t*c[0];
        const y = u*u*a[1] + 2*u*t*b[1] + t*t*c[1];
        const col = Array.isArray(o.color) ? o.color[i % o.color.length] : o.color;
        s += `<circle cx="${F(x)}" cy="${F(y)}" r="${o.r || 3.8}" fill="${col}"/>
              <circle cx="${F(x-1)}" cy="${F(y-1.2)}" r="${(o.r||3.8)*0.34}" fill="#fff" opacity="0.65"/>`;
      }
      return s;
    },
    pendant(o){
      const chain = o.chain || '#DAA520';
      const drop = o.drop || 18;
      let s = stroke(curvePath([[80,151],[100,151+drop],[120,151]]), chain, 1.4, 0.95);
      const y = 151 + drop + 2;
      if (o.charm === 'heart')
        s += `<path d="M94,${y+3} Q94,${y-2} 100,${y+2} Q106,${y-2} 106,${y+3} Q106,${y+9} 100,${y+13} Q94,${y+9} 94,${y+3} Z" fill="${o.color}"/>`;
      else if (o.charm === 'star')
        s += `<text x="100" y="${y+12}" font-size="15" text-anchor="middle" fill="${o.color}">★</text>`;
      else
        s += `<circle cx="100" cy="${y+6}" r="5.5" fill="${o.color}"/>`;
      s += `<circle cx="97.5" cy="${y+3}" r="1.4" fill="#fff" opacity="0.6"/>`;
      return s;
    }
  },
  bracelet: {
    none(){ return ''; },
    band(o){
      const w = pointAt(GEO.arm.line, 0.9);
      let s = paint(tube(GEO.arm.line, GEO.arm.w, {t0: 0.86, t1: 0.95, pad: 1.8}), o.color, {sheen: true});
      if (o.stripes){
        s += stroke('M' + F(w[0]-8) + ',' + F(w[1]-1) + ' L' + F(w[0]+8) + ',' + F(w[1]-1), o.stripes[0], 1.8, 0.9);
        s += stroke('M' + F(w[0]-8) + ',' + F(w[1]+3) + ' L' + F(w[0]+8) + ',' + F(w[1]+3), o.stripes[1], 1.8, 0.9);
      }
      return pair(s);
    },
    beads(o){
      const w = pointAt(GEO.arm.line, 0.9);
      let s = '';
      const n = o.count || 5;
      for (let i = 0; i < n; i++){
        const t = i/(n-1);
        const x = w[0] - 9 + 18*t, y = w[1] + Math.sin(t*Math.PI)*-2.5;
        const col = Array.isArray(o.color) ? o.color[i % o.color.length] : o.color;
        s += `<circle cx="${F(x)}" cy="${F(y)}" r="3.4" fill="${col}"/>
              <circle cx="${F(x-0.8)}" cy="${F(y-1)}" r="1.1" fill="#fff" opacity="0.55"/>`;
      }
      return pair(s);
    },
    charms(o){
      const w = pointAt(GEO.arm.line, 0.9);
      let s = stroke(curvePath([[w[0]-10,w[1]-1],[w[0],w[1]-4],[w[0]+10,w[1]-1]]), '#C0C0C0', 2, 0.95);
      s += `<text x="${F(w[0]-9)}" y="${F(w[1]+6)}" font-size="8" fill="#FFD700">★</text>
            <text x="${F(w[0]-1)}" y="${F(w[1]+9)}" font-size="8" fill="#FF69B4">♥</text>
            <text x="${F(w[0]+7)}" y="${F(w[1]+6)}" font-size="7" fill="#9B59B6">◆</text>`;
      return pair(s);
    }
  }
};

/* ---------- the doll herself (built from GEO, like the clothes) ---------- */
function buildBody(){
  const skin = 'var(--skin)', shade = 'var(--skin-shade)', line = 'var(--skin-line)';
  let s = `<ellipse cx="100" cy="412" rx="44" ry="6" fill="#000" opacity="0.12"/>`;

  /* legs + feet */
  s += pair(paint(tube(GEO.leg.line, GEO.leg.w), skin, {sheen: true}));
  s += pair(paint(footShape(), skin, {sheen: true}));
  s += pair(stroke(curvePath([[63,398],[66,404],[72,406]]), line, 1, 0.35));
  s += pair(stroke(curvePath([[70,318],[78,321],[86,318]]), line, 1.4, 0.2));   // knee

  /* torso + neck */
  s += paint(bodice({top: 146, bottom: 272, pad: 0, neckW: 16, neckD: 4, hemDip: 0}), skin, {sheen: true});
  s += `<path d="${ringPath([[87,GEO.neck.top],[86,140],[88,GEO.neck.bottom],
                             [112,GEO.neck.bottom],[114,140],[113,GEO.neck.top]])}" fill="${skin}"/>`;
  s += `<ellipse cx="100" cy="128" rx="18" ry="8" fill="${shade}" opacity="0.35"/>`;
  s += pair(stroke(curvePath([[84,156],[92,159],[97,157]]), line, 1.2, 0.28));  // collarbone

  /* head + ears. Ears stay put for every face shape so earrings still land on
     them; the face outline itself comes from the chosen head shape. */
  s += pair(`<ellipse cx="${GEO.ear.cx}" cy="${GEO.ear.cy}" rx="${GEO.ear.rx}" ry="${GEO.ear.ry}" fill="${skin}"/>
             <ellipse cx="${GEO.ear.cx}" cy="${GEO.ear.cy}" rx="5" ry="7" fill="${shade}" opacity="0.4"/>`);
  const face = headRing();
  s += `<path d="${face}" fill="${skin}"/><path d="${face}" fill="url(#gEdge)"/>`;

  /* arms + hands, in front of the torso */
  s += pair(paint(tube(GEO.arm.line, GEO.arm.w), skin, {sheen: true}));
  s += pair(`<ellipse cx="${GEO.arm.hand[0]}" cy="${GEO.arm.hand[1]}" rx="7.4" ry="10.5" fill="${skin}"
                      transform="rotate(7 ${GEO.arm.hand[0]} ${GEO.arm.hand[1]})"/>
             <ellipse cx="${GEO.arm.hand[0]}" cy="${GEO.arm.hand[1]}" rx="7.4" ry="10.5" fill="url(#gEdge)"
                      transform="rotate(7 ${GEO.arm.hand[0]} ${GEO.arm.hand[1]})"/>` +
             stroke('M43,272 L42,278 M46,273 L46,279 M49,272 L50,278', line, 1, 0.3));
  document.getElementById('layer-body').innerHTML = s;
}

function buildFace(){
  const line = 'var(--skin-line)';
  const eye = (cx) => `
    <ellipse cx="${cx}" cy="76" rx="8.2" ry="9" fill="#FDFBF7"/>
    <ellipse cx="${cx}" cy="76" rx="8.2" ry="9" fill="url(#gEdge)" opacity="0.5"/>
    <ellipse cx="${cx+1}" cy="77" rx="5.2" ry="6.2" fill="#5A3A18"/>
    <ellipse cx="${cx+1}" cy="78.5" rx="5.2" ry="4" fill="#4A2C10" opacity="0.55"/>
    <ellipse cx="${cx+1}" cy="76.5" rx="2.3" ry="2.7" fill="#141414"/>
    <circle cx="${cx+2.6}" cy="74" r="1.7" fill="#fff"/>
    <circle cx="${cx-1.2}" cy="79.5" r="0.9" fill="#fff" opacity="0.55"/>
    <path d="M${cx-8.4},74 Q${cx},66.5 ${cx+8.4},74" fill="none" stroke="#2A1F1A" stroke-width="2" stroke-linecap="round"/>
    <path d="M${cx-8},69.5 Q${cx},64.5 ${cx+8},69.8" fill="none" stroke="#6B4C3B" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>`;
  let s = eye(85) + eye(115);
  /* lashes */
  s += `<path d="M77,71 L73,67 M92.5,70.5 L95,66.5" stroke="#2A1F1A" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M107.5,70.5 L105,66.5 M123,71 L127,67" stroke="#2A1F1A" stroke-width="1.4" stroke-linecap="round"/>`;
  /* nose + mouth + cheeks */
  s += `<path d="M97,88 Q100,95 103,90" fill="none" stroke="${line}" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="100" cy="92" rx="4.5" ry="2.4" fill="var(--skin-shade)" opacity="0.3"/>
        <path id="base-mouth" d="M88,106 Q100,117 112,106" fill="none" stroke="#C96A80" stroke-width="2.2" stroke-linecap="round"/>`;
  /* blush follows the cheek, so it stays on a narrow face */
  const bx = 100 - (headHalfW(96) - 9);
  s += `<ellipse cx="${F(bx)}" cy="96" rx="12" ry="8" fill="url(#gCheek)"/>
        <ellipse cx="${F(200-bx)}" cy="96" rx="12" ry="8" fill="url(#gCheek)"/>`;
  document.getElementById('layer-face').innerHTML = s;
}

/* ---------- turn one wardrobe entry into SVG ---------- */
function svgFor(cat, item){
  if (item.style){
    const maker = (STYLES[cat] || {})[item.style];
    if (!maker) return { [cat]: '' };
    const out = maker(item);
    /* a maker may return one string, or {layerId: svg} to paint several layers */
    return (typeof out === 'string') ? { [cat]: out } : out;
  }
  if (item.back !== undefined || item.front !== undefined)
    return { 'hair-back': item.back || '', 'hair-front': item.front || '' };
  return { [cat]: item.svg || '' };
}

function render(cat){
  const item = opts[cat][state[cat]];
  const label = document.getElementById('opt-' + cat);
  if (label) label.textContent = item.name;

  /* the face shape lives in the body layer, and hair is fitted to it */
  if (cat === 'head'){
    buildBody();
    buildFace();
    render('hair');
    render('makeup');   // rebuilt face needs the lipstick state re-applied
    return;
  }

  (LAYERS[cat] || [cat]).forEach(id => {
    const g = document.getElementById('layer-' + id);
    if (g) g.innerHTML = '';
  });
  const parts = svgFor(cat, item);
  Object.keys(parts).forEach(id => {
    const g = document.getElementById('layer-' + id);
    if (g) g.innerHTML = parts[id];
  });

  /* hide the plain mouth when a lipstick look is on */
  const m = document.getElementById('base-mouth');
  if (m) m.style.display = (state.makeup === 0) ? '' : 'none';
}
const renderAll = () => Object.keys(opts).forEach(render);

function applySkin(){
  const s = SKINS[skinIdx], root = document.documentElement.style;
  root.setProperty('--skin', s.base);
  root.setProperty('--skin-shade', s.shade);
  root.setProperty('--skin-line', s.line);
  document.querySelectorAll('#skin-swatches .swatch').forEach((b, i) =>
    b.classList.toggle('active', i === skinIdx));
}
function applyHairColor(){
  document.querySelectorAll('#hair-swatches .swatch').forEach((b, i) =>
    b.classList.toggle('active', i === hairIdx));
}

/* ---------- controls are generated from CATEGORIES ---------- */
function buildControls(){
  let h = `
    <div class="action-row">
      <button class="action-btn surprise" onclick="surpriseMe()">🎲 Surprise!</button>
      <button class="action-btn save" onclick="saveLook()">📸 Save</button>
      <button class="action-btn reset-btn" onclick="resetDoll()">🔄 Reset</button>
    </div>`;
  CATEGORIES.forEach(c => {
    if (c.sep){ h += `<div class="section-label">${c.sep}</div>`; return; }
    if (c.swatch === 'skin'){
      h += `<div class="swatch-row"><span class="cat-icon">${c.icon}</span>
              <span class="cat-name">${c.label}</span>
              <div id="skin-swatches" style="display:flex;gap:7px;flex:1;justify-content:center">
                ${SKINS.map((s,i) => `<button class="swatch" style="background:${s.base}" title="${s.name}" onclick="setSkin(${i})"></button>`).join('')}
              </div></div>`;
      return;
    }
    if (c.swatch === 'hair'){
      h += `<div class="swatch-row"><span class="cat-icon">${c.icon}</span>
              <span class="cat-name">${c.label}</span>
              <div id="hair-swatches" style="display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:center">
                ${HAIR_COLORS.map((s,i) => `<button class="swatch sm" style="background:${s.hex}" title="${s.name}" onclick="setHairColor(${i})"></button>`).join('')}
              </div></div>`;
      return;
    }
    if (!opts[c.key]) return;
    h += `<div class="category-row${c.required ? ' required' : ''}">
            <span class="cat-icon">${c.icon}</span>
            <span class="cat-name">${c.label}</span>
            <button class="nav-btn" onclick="change('${c.key}',-1)">◀</button>
            <span class="option-name" id="opt-${c.key}">—</span>
            <button class="nav-btn" onclick="change('${c.key}',1)">▶</button>
          </div>`;
  });
  document.getElementById('controls').innerHTML = h;
}

/* ---------- persistence ---------- */
function persist(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      state, skin: skinIdx, hair: hairIdx, name: document.getElementById('doll-name').value
    }));
  } catch(e){}
}
function restore(){
  try {
    /* fall back to the previous save format so an existing doll isn't lost */
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || localStorage.getItem("dollDressup.v2"));
    if (!d) return;
    Object.keys(opts).forEach(k => {
      if (typeof d.state?.[k] === 'number' && d.state[k] < opts[k].length) state[k] = d.state[k];
    });
    if (typeof d.skin === 'number' && d.skin < SKINS.length) skinIdx = d.skin;
    if (typeof d.hair === 'number' && d.hair < HAIR_COLORS.length) hairIdx = d.hair;
    if (d.name) document.getElementById('doll-name').value = d.name;
  } catch(e){}
}

/* ---------- actions ---------- */
function pop(cls){
  const svg = document.getElementById('doll');
  svg.classList.remove('pop', 'wiggle');
  void svg.offsetWidth;
  svg.classList.add(cls || 'pop');
}
function change(cat, dir){
  state[cat] = (state[cat] + dir + opts[cat].length) % opts[cat].length;
  render(cat); pop('pop'); persist();
}
function setSkin(i){ skinIdx = i; applySkin(); pop('pop'); persist(); }
function setHairColor(i){ hairIdx = i; applyHairColor(); render('hair'); pop('pop'); persist(); }
function surpriseMe(){
  Object.keys(opts).forEach(cat => {
    if (cat === 'scene') return;
    state[cat] = Math.floor(Math.random() * opts[cat].length);
    render(cat);
  });
  hairIdx = Math.floor(Math.random() * HAIR_COLORS.length);
  applyHairColor(); render('hair');
  pop('wiggle'); persist();
}
function resetDoll(){
  Object.keys(opts).forEach(cat => { state[cat] = 0; render(cat); });
  skinIdx = 1; hairIdx = 0;
  applySkin(); applyHairColor(); render('hair');
  pop('wiggle'); persist();
}
function saveLook(){
  const svg = document.getElementById('doll');
  const clone = svg.cloneNode(true);
  const s = SKINS[skinIdx];
  clone.setAttribute('style', `--skin:${s.base};--skin-shade:${s.shade};--skin-line:${s.line}`);
  clone.setAttribute('width', '400');
  clone.setAttribute('height', '840');
  const xml = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml' }));
  const img = new Image();
  img.onload = function(){
    const c = document.createElement('canvas');
    c.width = 400; c.height = 840;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = (document.getElementById('doll-name').value.trim() || 'my-doll')
      .replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.png';
    a.href = c.toDataURL('image/png');
    a.click();
  };
  img.src = url;
}

/* ---------- go ---------- */
buildControls();
buildBody();
buildFace();
restore();
renderAll();
applySkin();
applyHairColor();
document.getElementById('doll-name').addEventListener('change', persist);
</script>
</body>
</html>
