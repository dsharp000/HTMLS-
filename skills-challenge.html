<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Skills Challenge</title>
<meta name="description" content="Soccer skills challenge scorecard: shooting, passing, dribbling, penalty kicks, and juggling for every kid, with leaderboards and progress over time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#15803d">
<meta property="og:title" content="Skills Challenge">
<meta property="og:description" content="Track every kid's shooting, passing, dribbling, penalty kick, and juggling scores.">
<meta property="og:type" content="website">
<style>
  :root {
    --bg: #f3f6f1;
    --surface: #ffffff;
    --surface-2: #eef3ec;
    --ink: #14201a;
    --ink-2: #4b5b52;
    --ink-3: #7c8a82;
    --line: #dbe3d8;
    --accent: #15803d;
    --accent-ink: #ffffff;
    --accent-soft: #dcfce7;
    --danger: #b91c1c;
    --gold: #b8860b;
    --silver: #7c8794;
    --bronze: #a0522d;
    --c-shooting: #dc2626;
    --c-passing: #2563eb;
    --c-dribbling: #9333ea;
    --c-pk: #ea580c;
    --c-juggling: #0d9488;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1410;
      --surface: #142019;
      --surface-2: #1b2a21;
      --ink: #e7f0ea;
      --ink-2: #a9b8ae;
      --ink-3: #74857a;
      --line: #26382d;
      --accent: #22c55e;
      --accent-ink: #062611;
      --accent-soft: #143d24;
      --danger: #f87171;
      --gold: #fbbf24;
      --silver: #cbd5e1;
      --bronze: #f59e0b;
      --c-shooting: #f87171;
      --c-passing: #60a5fa;
      --c-dribbling: #c084fc;
      --c-pk: #fb923c;
      --c-juggling: #2dd4bf;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1410; --surface: #142019; --surface-2: #1b2a21; --ink: #e7f0ea; --ink-2: #a9b8ae;
    --ink-3: #74857a; --line: #26382d; --accent: #22c55e; --accent-ink: #062611; --accent-soft: #143d24;
    --danger: #f87171; --gold: #fbbf24; --silver: #cbd5e1; --bronze: #f59e0b;
    --c-shooting: #f87171; --c-passing: #60a5fa; --c-dribbling: #c084fc; --c-pk: #fb923c; --c-juggling: #2dd4bf;
    --shadow: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* Header */
  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 14px 16px 12px;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  .head-inner { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .head-inner h1 { font-size: 20px; font-weight: 750; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head-sub { max-width: 860px; margin: 4px auto 0; font-size: 13px; opacity: .85; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sync { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; opacity: .9; }
  .sync i { width: 8px; height: 8px; border-radius: 50%; background: #facc15; display: inline-block; }
  .sync.on i { background: #bbf7d0; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .sync.off i { background: #fca5a5; }
  .home-link { color: inherit; text-decoration: none; font-size: 22px; line-height: 1; opacity: .9; }

  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Tab bar */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--surface); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  #tabs button {
    flex: 1; background: none; border: 0; height: 60px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11px; font-weight: 650; color: var(--ink-3); letter-spacing: .02em;
  }
  #tabs button .ti { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .7; }
  #tabs button.active { color: var(--accent); }
  #tabs button.active .ti { filter: none; opacity: 1; }

  /* Common */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .pad { padding: 14px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; color: var(--ink-3); }
  h2 { font-size: 17px; font-weight: 720; margin-bottom: 10px; }
  h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
  .stack > * + * { margin-top: 12px; }

  .btn {
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px;
    padding: 9px 14px; font-weight: 650; font-size: 14px; white-space: nowrap;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .field {
    width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 9px 12px; font-size: 16px;
  }
  .field:focus, .score-in:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }

  /* Session bar */
  .session-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .session-bar select { flex: 1; min-width: 0; }

  /* Skill chips */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px 12px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 7px 13px; font-size: 14px; font-weight: 650; display: inline-flex; gap: 6px; align-items: center;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sc, var(--ink-3)); }
  .chip.active { background: var(--sc, var(--accent)); border-color: transparent; color: #fff; }
  .chip.active .dot { background: #fff; }
  .chip .cnt { font-size: 12px; opacity: .75; font-weight: 600; }

  .station-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .station-head .how { font-size: 13px; color: var(--ink-2); }

  /* Score rows */
  .plist { list-style: none; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); min-height: 58px; }
  .prow:first-child { border-top: 0; }
  .pname { flex: 1; min-width: 0; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pname .num { color: var(--ink-3); font-weight: 600; font-size: 13px; margin-right: 4px; }
  .prow.done .pname::after { content: " ✓"; color: var(--accent); font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
    font-size: 20px; font-weight: 700; line-height: 1; display: grid; place-items: center;
  }
  .score-in {
    width: 64px; height: 40px; text-align: center; font-size: 18px; font-weight: 700;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    -moz-appearance: textfield; font-variant-numeric: tabular-nums;
  }
  .score-in::-webkit-outer-spin-button, .score-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .of { font-size: 13px; color: var(--ink-3); width: 30px; }
  .timer-btn {
    height: 40px; min-width: 82px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
    font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .timer-btn.running { background: var(--c-dribbling); color: #fff; border-color: transparent; }

  .empty { text-align: center; padding: 34px 18px; color: var(--ink-2); }
  .empty .big { font-size: 40px; margin-bottom: 6px; }

  /* Leaderboard */
  .lb-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .lb-row:first-child { border-top: 0; }
  .lb-row.clickable { cursor: pointer; }
  .rank { font-weight: 800; font-size: 16px; text-align: center; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rank.r1 { color: var(--gold); } .rank.r2 { color: var(--silver); } .rank.r3 { color: var(--bronze); }
  .lb-score { font-weight: 800; font-size: 18px; text-align: right; font-variant-numeric: tabular-nums; }
  .lb-score small { display: block; font-size: 11px; font-weight: 600; color: var(--ink-3); }
  .bars { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: var(--surface-2); margin-top: 5px; }
  .bars span { display: block; height: 100%; }
  .bars span + span { border-left: 1px solid var(--surface); }
  .inc { font-size: 11px; color: var(--ink-3); font-weight: 600; margin-left: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  /* Players */
  .pl-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .pl-row:first-child { border-top: 0; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: 0 0 auto; }
  .chev { color: var(--ink-3); font-size: 18px; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  @media (min-width: 700px) { .modal-bg { align-items: center; } .modal { border-radius: 18px; } }
  .modal-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .modal-top h2 { margin: 0; flex: 1; }
  .x { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--ink-3); padding: 2px 6px; }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: center; border-top: 1px solid var(--line); white-space: nowrap; }
  thead th { border-top: 0; font-size: 12px; color: var(--ink-2); font-weight: 700; background: var(--surface-2); }
  th:first-child, td:first-child { text-align: left; }
  td.pb { font-weight: 800; color: var(--accent); }
  .stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .tile { background: var(--surface-2); border-radius: 12px; padding: 10px; }
  .tile .k { font-size: 11px; color: var(--ink-2); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tile .d { font-size: 12px; color: var(--ink-3); }

  .sess-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .sess-row:first-child { border-top: 0; }
  .badge { font-size: 11px; font-weight: 750; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 999px; }
  .set-grid { display: grid; grid-template-columns: 1fr 90px; gap: 8px 12px; align-items: center; }

  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .2s; z-index: 200; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <a class="home-link" href="index.html" aria-label="Back to all apps">‹</a>
    <h1 id="event-title">⚽ Skills Challenge</h1>
    <span class="sync" id="sync"><i></i><span>Connecting…</span></span>
  </div>
  <div class="head-sub" id="head-sub"></div>
</header>

<main>
  <!-- SCORE -->
  <section class="screen active" id="scr-score">
    <div class="session-bar">
      <select class="field" id="score-session" aria-label="Challenge day"></select>
      <button class="btn" id="new-session-btn">+ New day</button>
    </div>
    <div class="chips" id="skill-chips"></div>
    <div id="station"></div>
  </section>

  <!-- LEADERBOARD -->
  <section class="screen" id="scr-board">
    <div class="session-bar">
      <select class="field" id="board-session" aria-label="Challenge day"></select>
    </div>
    <div class="chips" id="board-chips"></div>
    <div id="board"></div>
  </section>

  <!-- PLAYERS -->
  <section class="screen" id="scr-players">
    <div class="card pad stack">
      <div>
        <label class="lbl" for="add-name">Add kids</label>
        <div class="row">
          <input class="field grow" id="add-name" placeholder="Name (or paste several, comma separated)" autocomplete="off">
          <button class="btn primary" id="add-btn">Add</button>
        </div>
      </div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn sm" id="import-btn">Import roster from Match Tracker</button>
        <span class="tiny" id="pcount"></span>
      </div>
    </div>
    <div style="height:12px"></div>
    <div class="card" id="player-list"></div>
  </section>

  <!-- SETUP -->
  <section class="screen" id="scr-setup">
    <div class="stack">
      <div class="card pad">
        <h2>Challenge</h2>
        <label class="lbl" for="event-name">Name</label>
        <input class="field" id="event-name" placeholder="Skills Challenge">
      </div>

      <div class="card">
        <div class="pad" style="padding-bottom:4px"><h2>Challenge days</h2>
          <p class="small muted">Run the challenge more than once (week 1, end of season…) to see each kid improve.</p></div>
        <div id="session-list"></div>
        <div class="pad"><button class="btn" id="new-session-btn2">+ New challenge day</button></div>
      </div>

      <div class="card pad">
        <h2>Scoring</h2>
        <div class="set-grid" id="settings-grid"></div>
        <p class="small muted" style="margin-top:12px" id="scoring-explain"></p>
      </div>

      <div class="card pad">
        <h2>Export</h2>
        <p class="small muted" style="margin-bottom:10px">Download every kid's scores for every day as a spreadsheet (CSV).</p>
        <button class="btn" id="csv-btn">Download CSV</button>
      </div>
    </div>
  </section>
</main>

<nav id="tabs">
  <button data-tab="score" class="active"><span class="ti">📝</span>Score</button>
  <button data-tab="board"><span class="ti">🏆</span>Leaders</button>
  <button data-tab="players"><span class="ti">👟</span>Kids</button>
  <button data-tab="setup"><span class="ti">⚙️</span>Setup</button>
</nav>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
// ── SKILLS ────────────────────────────────────────────────────────────────
// kind 'count'  : attempts made out of a max (points = % of max)
// kind 'touches': juggling touches, best in the day = 100 pts
// kind 'time'   : seconds through the cone course, fastest in the day = 100 pts
const SKILLS = [
  { id: 'shooting',  name: 'Shooting',      icon: '🎯', kind: 'count',   color: 'var(--c-shooting)',  how: 'Goals scored', defMax: 10 },
  { id: 'passing',   name: 'Passing',       icon: '🔁', kind: 'count',   color: 'var(--c-passing)',   how: 'Passes through the gate', defMax: 10 },
  { id: 'dribbling', name: 'Dribbling',     icon: '⚡', kind: 'time',    color: 'var(--c-dribbling)', how: 'Seconds through the cones (lower is better)' },
  { id: 'pk',        name: 'Penalty Kicks', icon: '🥅', kind: 'count',   color: 'var(--c-pk)',        how: 'PKs scored', defMax: 5 },
  { id: 'juggling',  name: 'Juggling',      icon: '🤹', kind: 'touches', color: 'var(--c-juggling)',  how: 'Best number of touches in a row' },
];
const SK = Object.fromEntries(SKILLS.map(s => [s.id, s]));

// ── STATE ─────────────────────────────────────────────────────────────────
const LS_KEY = 'skills-challenge-v1';
const ROOT = 'soccer/skills-challenge';
let state = blankState();
let ui = { tab: 'score', skill: 'shooting', boardSkill: 'overall', boardSession: null };
let fb = null; // { db, ref, set } once Firebase is up
let timer = null; // { pid, start, raf }

function blankState() {
  return { event: 'Skills Challenge', players: {}, sessions: {}, current: null, scores: {}, settings: {} };
}
function normalize(v) {
  const s = Object.assign(blankState(), v || {});
  ['players', 'sessions', 'scores', 'settings'].forEach(k => { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
  return s;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function maxFor(sid) { const v = +state.settings[sid + 'Max']; return v > 0 ? v : SK[sid].defMax; }

function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) state = normalize(JSON.parse(raw)); } catch (e) {}
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

// Write one value at a path (e.g. "scores/sess/pid/shooting"), locally and to Firebase.
function put(path, value) {
  const parts = path.split('/');
  let o = state;
  for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {}; o = o[parts[i]]; }
  const last = parts[parts.length - 1];
  if (value === null || value === undefined || value === '') delete o[last]; else o[last] = value;
  saveLocal();
  if (fb) fb.set(fb.ref(fb.db, ROOT + '/' + path), (value === '' || value === undefined) ? null : value).catch(e => console.warn('write failed', e));
}

function sessionsSorted() {
  return Object.entries(state.sessions).map(([id, s]) => ({ id, ...s }))
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0));
}
function playersSorted() {
  return Object.entries(state.players).map(([id, p]) => ({ id, ...p }))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
}
function ensureSession() {
  if (state.current && state.sessions[state.current]) return state.current;
  const list = sessionsSorted();
  if (list.length) { state.current = list[list.length - 1].id; return state.current; }
  return createSession();
}
function createSession(name) {
  const id = uid();
  const n = Object.keys(state.sessions).length + 1;
  put('sessions/' + id, { name: name || ('Challenge Day ' + n), date: today(), created: Date.now() });
  put('current', id);
  return id;
}
function getScore(sess, pid, sid) {
  const v = state.scores?.[sess]?.[pid]?.[sid];
  return (v === undefined || v === null || v === '') ? null : +v;
}

// ── SCORING ───────────────────────────────────────────────────────────────
function sessionResults(sess) {
  const players = playersSorted();
  const best = {};
  SKILLS.forEach(s => {
    const vals = players.map(p => getScore(sess, p.id, s.id)).filter(v => v !== null && (s.kind !== 'time' || v > 0));
    best[s.id] = vals.length ? (s.kind === 'time' ? Math.min(...vals) : Math.max(...vals)) : null;
  });
  const rows = players.map(p => {
    const pts = {}; let total = 0; let done = 0;
    SKILLS.forEach(s => {
      const v = getScore(sess, p.id, s.id);
      let pt = 0;
      if (v !== null) {
        done++;
        if (s.kind === 'count') pt = Math.min(100, (v / maxFor(s.id)) * 100);
        else if (s.kind === 'touches') pt = best[s.id] > 0 ? (v / best[s.id]) * 100 : 0;
        else if (s.kind === 'time') pt = v > 0 && best[s.id] ? (best[s.id] / v) * 100 : 0;
      }
      pts[s.id] = Math.round(pt);
      total += pts[s.id];
    });
    return { p, pts, total, done };
  }).filter(r => r.done > 0);
  rows.sort((a, b) => b.total - a.total || b.done - a.done || a.p.name.localeCompare(b.p.name));
  rankRows(rows, r => r.total);
  return { rows, best };
}
function rankRows(rows, key) {
  let prev = null, rank = 0;
  rows.forEach((r, i) => { const k = key(r); if (k !== prev) { rank = i + 1; prev = k; } r.rank = rank; });
}
function fmt(sid, v) {
  if (v === null) return '–';
  if (SK[sid].kind === 'time') return (+v).toFixed(1) + 's';
  if (SK[sid].kind === 'count') return v + '/' + maxFor(sid);
  return String(v);
}

// ── RENDER: HEADER & SESSION PICKERS ──────────────────────────────────────
function renderHeader() {
  document.getElementById('event-title').textContent = '⚽ ' + (state.event || 'Skills Challenge');
  document.title = state.event || 'Skills Challenge';
  const s = state.sessions[state.current];
  const np = Object.keys(state.players).length;
  document.getElementById('head-sub').textContent = (s ? s.name + ' · ' + prettyDate(s.date) + ' · ' : '') + np + (np === 1 ? ' kid' : ' kids');
}
function prettyDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-').map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function fillSessionSelect(el, value) {
  const list = sessionsSorted();
  el.innerHTML = list.map(s => `<option value="${s.id}">${esc(s.name)} · ${esc(prettyDate(s.date))}</option>`).join('');
  el.value = value;
}

// ── RENDER: SCORE STATION ─────────────────────────────────────────────────
let stationKey = '';
function renderScore() {
  const sess = ensureSession();
  fillSessionSelect(document.getElementById('score-session'), sess);
  const players = playersSorted();

  document.getElementById('skill-chips').innerHTML = SKILLS.map(s => {
    const n = players.filter(p => getScore(sess, p.id, s.id) !== null).length;
    return `<button class="chip ${ui.skill === s.id ? 'active' : ''}" style="--sc:${s.color}" data-skill="${s.id}">
      <span class="dot"></span>${s.name}<span class="cnt">${n}/${players.length}</span></button>`;
  }).join('');

  const st = document.getElementById('station');
  if (!players.length) {
    stationKey = '';
    st.innerHTML = `<div class="card empty"><div class="big">👟</div><p><b>No kids yet.</b></p>
      <p class="small" style="margin:4px 0 14px">Add your players first, then come back to score them.</p>
      <button class="btn primary" data-goto="players">Add kids</button></div>`;
    return;
  }
  const skill = SK[ui.skill];
  const key = sess + '|' + skill.id + '|' + players.map(p => p.id + p.name + (p.number || '')).join(',') + '|' + maxFor(skill.id);
  if (key !== stationKey) {
    stationKey = key;
    st.innerHTML = `<div class="station-head"><h2 style="margin:0">${skill.icon} ${skill.name}</h2><span class="how">${esc(skill.how)}${skill.kind === 'count' ? ' out of ' + maxFor(skill.id) : ''}</span></div>
      <ul class="card plist">${players.map(p => rowHtml(sess, skill, p)).join('')}</ul>`;
  } else {
    // Patch values only, so a coach typing in a box doesn't lose focus when another device syncs.
    players.forEach(p => {
      const v = getScore(sess, p.id, skill.id);
      const inp = st.querySelector(`.score-in[data-pid="${p.id}"]`);
      if (inp && document.activeElement !== inp) inp.value = v === null ? '' : v;
      const li = st.querySelector(`.prow[data-pid="${p.id}"]`);
      if (li) li.classList.toggle('done', v !== null);
    });
  }
}
function rowHtml(sess, skill, p) {
  const v = getScore(sess, p.id, skill.id);
  const val = v === null ? '' : v;
  const name = `<span class="pname">${p.number ? `<span class="num">#${esc(p.number)}</span>` : ''}${esc(p.name)}</span>`;
  let ctrl;
  if (skill.kind === 'time') {
    const running = timer && timer.pid === p.id;
    ctrl = `<button class="timer-btn ${running ? 'running' : ''}" data-timer="${p.id}">${running ? 'Stop' : '⏱ Start'}</button>
      <input class="score-in" data-pid="${p.id}" type="number" inputmode="decimal" step="0.1" min="0" value="${val}" placeholder="sec" aria-label="${esc(p.name)} seconds">`;
  } else {
    ctrl = `<div class="stepper"><button data-step="-1" data-pid="${p.id}" aria-label="minus">−</button>
      <input class="score-in" data-pid="${p.id}" type="number" inputmode="numeric" min="0" ${skill.kind === 'count' ? `max="${maxFor(skill.id)}"` : ''} value="${val}" placeholder="–" aria-label="${esc(p.name)} ${skill.name}">
      <button data-step="1" data-pid="${p.id}" aria-label="plus">+</button></div>
      ${skill.kind === 'count' ? `<span class="of">/${maxFor(skill.id)}</span>` : ''}`;
  }
  return `<li class="prow ${v !== null ? 'done' : ''}" data-pid="${p.id}">${name}${ctrl}</li>`;
}
function setScore(pid, raw) {
  const sess = ensureSession();
  const skill = SK[ui.skill];
  let v = raw === '' || raw === null ? null : Number(raw);
  if (v !== null) {
    if (!isFinite(v) || v < 0) v = 0;
    if (skill.kind === 'count') v = Math.min(Math.round(v), maxFor(skill.id));
    else if (skill.kind === 'touches') v = Math.round(v);
    else v = Math.round(v * 10) / 10;
  }
  put(`scores/${sess}/${pid}/${skill.id}`, v);
  renderAll();
}

// Dribbling stopwatch
function toggleTimer(pid) {
  if (timer && timer.pid === pid) {
    const secs = (performance.now() - timer.start) / 1000;
    cancelAnimationFrame(timer.raf);
    timer = null;
    stationKey = '';
    setScore(pid, secs.toFixed(1));
    toast('Saved ' + secs.toFixed(1) + 's');
    return;
  }
  if (timer) { cancelAnimationFrame(timer.raf); }
  timer = { pid, start: performance.now() };
  stationKey = '';
  renderScore();
  const tick = () => {
    const b = document.querySelector(`[data-timer="${pid}"]`);
    if (b && timer) b.textContent = ((performance.now() - timer.start) / 1000).toFixed(1) + 's ■';
    if (timer) timer.raf = requestAnimationFrame(tick);
  };
  tick();
}

// ── RENDER: LEADERBOARD ───────────────────────────────────────────────────
function renderBoard() {
  const list = sessionsSorted();
  if (!ui.boardSession || !state.sessions[ui.boardSession]) ui.boardSession = state.current || (list.length && list[list.length - 1].id);

  document.getElementById('board-chips').innerHTML = opts.map(s =>
    `<button class="chip ${ui.boardSkill === s.id ? 'active' : ''}" style="--sc:${s.color}" data-bskill="${s.id}"><span class="dot"></span>${s.name}</button>`).join('');

  const el = document.getElementById('board');
  if (!sess) { el.innerHTML = emptyBoard(); return; }
  const { rows } = sessionResults(sess);

  if (ui.boardSkill === 'overall') {
    if (!rows.length) { el.innerHTML = emptyBoard(); return; }
    el.innerHTML = `<div class="card">${rows.map(r => `
      <div class="lb-row clickable" data-player="${r.p.id}">
        <div class="rank r${r.rank}">${medal(r.rank)}</div>
        <div style="min-width:0"><div class="pname" style="display:block">${esc(r.p.name)}${r.done < SKILLS.length ? `<span class="inc">${r.done}/${SKILLS.length} done</span>` : ''}</div>
          <div class="bars" title="${SKILLS.map(s => s.name + ': ' + r.pts[s.id]).join(', ')}">${SKILLS.map(s => `<span style="width:${r.pts[s.id] / 5}%;background:${s.color}"></span>`).join('')}</div></div>
        <div class="lb-score">${r.total}<small>of 500</small></div>
      </div>`).join('')}</div>
      <div class="legend">${SKILLS.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>
      <p class="tiny" style="margin-top:8px">Each skill is worth up to 100 points. ${scoringText()}</p>`;
  } else {
    const s = SK[ui.boardSkill];
    const skillRows = playersSorted().map(p => ({ p, v: getScore(sess, p.id, s.id) })).filter(r => r.v !== null && (s.kind !== 'time' || r.v > 0));
    skillRows.sort((a, b) => s.kind === 'time' ? a.v - b.v : b.v - a.v);
    rankRows(skillRows, r => r.v);
    if (!skillRows.length) { el.innerHTML = emptyBoard(s.name); return; }
    el.innerHTML = `<div class="card">${skillRows.map(r => `
      <div class="lb-row clickable" data-player="${r.p.id}">
        <div class="rank r${r.rank}">${medal(r.rank)}</div>
        <div class="pname">${esc(r.p.name)}</div>
        <div class="lb-score">${fmt(s.id, r.v)}</div>
      </div>`).join('')}</div>`;
  }
}
function medal(r) { return r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r; }
function emptyBoard(what) {
  return `<div class="card empty"><div class="big">🏆</div><p><b>No ${what ? esc(what) + ' ' : ''}scores yet for this day.</b></p>
    <p class="small" style="margin:4px 0 14px">Enter scores on the Score tab and the rankings fill in here.</p>
    <button class="btn primary" data-goto="score">Go to scoring</button></div>`;
}
function scoringText() {
  const c = SKILLS.filter(s => s.kind === 'count').map(s => `${s.name} out of ${maxFor(s.id)}`).join(', ');
  return `${c} are scored by percent made. Juggling: the most touches that day gets 100. Dribbling: the fastest time that day gets 100, slower times get proportionally less.`;
}

// ── RENDER: PLAYERS ───────────────────────────────────────────────────────
function renderPlayers() {
  const players = playersSorted();
  const sess = state.current;
  document.getElementById('pcount').textContent = players.length ? players.length + (players.length === 1 ? ' kid' : ' kids') : '';
  const el = document.getElementById('player-list');
  if (!players.length) { el.innerHTML = `<div class="empty"><div class="big">👟</div><p>Add every kid taking part in the challenge.</p></div>`; return; }
  el.innerHTML = players.map(p => {
    const done = sess ? SKILLS.filter(s => getScore(sess, p.id, s.id) !== null).length : 0;
    return `<div class="pl-row" data-player="${p.id}">
      <div class="avatar">${esc(initials(p.name))}</div>
      <div class="grow"><div class="pname" style="display:block">${p.number ? `<span class="num">#${esc(p.number)}</span>` : ''}${esc(p.name)}</div>
        <div class="tiny">${done}/${SKILLS.length} skills done today</div></div>
      <span class="chev">›</span></div>`;
  }).join('');
}
function initials(n) { return n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
function addPlayers(text) {
  const existing = new Set(Object.values(state.players).map(p => p.name.toLowerCase()));
  const names = text.split(/[,\n;]+/).map(s => s.trim()).filter(Boolean);
  let added = 0;
  names.forEach(n => {
    if (existing.has(n.toLowerCase())) return;
    existing.add(n.toLowerCase());
    put('players/' + uid() + added, { name: n.slice(0, 40), created: Date.now() });
    added++;
  });
  return added;
}

// ── PLAYER DETAIL MODAL ───────────────────────────────────────────────────
function openPlayer(pid) {
  const p = state.players[pid];
  if (!p) return;
  const sessions = sessionsSorted();
  const hist = sessions.map(s => {
    const { rows } = sessionResults(s.id);
    const r = rows.find(x => x.p.id === pid);
    return { s, r, vals: Object.fromEntries(SKILLS.map(k => [k.id, getScore(s.id, pid, k.id)])) };
  }).filter(h => h.r);

  const pb = {};
  SKILLS.forEach(k => {
    const vals = hist.map(h => h.vals[k.id]).filter(v => v !== null && (k.kind !== 'time' || v > 0));
    pb[k.id] = vals.length ? (k.kind === 'time' ? Math.min(...vals) : Math.max(...vals)) : null;
  });
  const first = hist[0], last = hist[hist.length - 1];

  let body = '';
  if (!hist.length) {
    body = `<p class="muted">No scores yet. Pick a skill on the Score tab to enter ${esc(p.name)}'s results.</p>`;
  } else {
    const delta = hist.length > 1 ? last.r.total - first.r.total : null;
    body = `<div class="stat-tiles">
        <div class="tile"><div class="k">Latest</div><div class="v">${last.r.total}</div><div class="d">#${last.r.rank} on ${esc(last.s.name)}</div></div>
        <div class="tile"><div class="k">Best day</div><div class="v">${Math.max(...hist.map(h => h.r.total))}</div><div class="d">of 500 points</div></div>
        ${delta !== null ? `<div class="tile"><div class="k">Progress</div><div class="v" style="color:${delta >= 0 ? 'var(--accent)' : 'var(--danger)'}">${delta >= 0 ? '+' : ''}${delta}</div><div class="d">since first day</div></div>` : ''}
      </div>
      <h3>Personal bests</h3>
      <div class="stat-tiles">${SKILLS.map(k => `<div class="tile" style="border-left:3px solid ${k.color}"><div class="k">${k.name}</div><div class="v">${fmt(k.id, pb[k.id])}</div></div>`).join('')}</div>
      <h3>Every challenge day</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Day</th>${SKILLS.map(k => `<th>${k.name}</th>`).join('')}<th>Points</th><th>Rank</th></tr></thead>
        <tbody>${hist.slice().reverse().map(h => `<tr><td>${esc(h.s.name)}<div class="tiny">${esc(prettyDate(h.s.date))}</div></td>
          ${SKILLS.map(k => `<td class="${hist.length > 1 && h.vals[k.id] !== null && h.vals[k.id] === pb[k.id] ? 'pb' : ''}">${fmt(k.id, h.vals[k.id])}</td>`).join('')}
          <td><b>${h.r.total}</b></td><td>${medal(h.r.rank)}</td></tr>`).join('')}</tbody>
      </table></div>
      ${hist.length > 1 ? '<p class="tiny" style="margin-top:6px">Green = personal best.</p>' : ''}`;
  }

  openModal(`<div class="modal-top"><div class="avatar">${esc(initials(p.name))}</div><h2>${esc(p.name)}</h2><button class="x" data-close aria-label="Close">×</button></div>
    ${body}
    <div style="height:18px"></div>
    <h3>Edit</h3>
    <div class="row" style="margin-bottom:8px">
      <input class="field grow" id="edit-name" value="${esc(p.name)}" aria-label="Name">
      <input class="field" id="edit-num" value="${esc(p.number || '')}" placeholder="#" style="width:70px" inputmode="numeric" aria-label="Jersey number">
    </div>
    <div class="row"><button class="btn primary" id="save-player" data-pid="${pid}">Save</button><span class="grow"></span>
      <button class="btn danger" id="del-player" data-pid="${pid}">Remove kid</button></div>`);
}
function openModal(html) { document.getElementById('modal').innerHTML = html; document.getElementById('modal-bg').classList.add('open'); }
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

// ── RENDER: SETUP ─────────────────────────────────────────────────────────
function renderSetup() {
  const en = document.getElementById('event-name');

  const list = sessionsSorted();

        <div class="tiny">${esc(prettyDate(s.date))} · ${n} ${n === 1 ? 'kid' : 'kids'} scored</div></div>

function editSession(id) {

    <label class="lbl" for="sess-date">Date</label><input class="field" id="sess-date" type="date" value="${esc(s.date || '')}" style="margin-bottom:14px">
    <div class="row"><button class="btn primary" id="save-sess" data-sid="${id}">Save</button><span class="grow"></span>
      <button class="btn danger" id="del-sess" data-sid="${id}">Delete day</button></div>`);
}

// ── CSV ───────────────────────────────────────────────────────────────────
function downloadCsv() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['Day', 'Date', 'Kid', 'Number', ...SKILLS.map(s => s.name + (s.kind === 'time' ? ' (sec)' : s.kind === 'count' ? ` (of ${maxFor(s.id)})` : ' (touches)')), 'Points', 'Rank'].map(q).join(',')];
  sessionsSorted().forEach(s => {
    sessionResults(s.id).rows.forEach(r => {
      lines.push([s.name, s.date, r.p.name, r.p.number || '', ...SKILLS.map(k => getScore(s.id, r.p.id, k.id) ?? ''), r.total, r.rank].map(q).join(','));
    });
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.event || 'skills-challenge').replace(/[^\w-]+/g, '-').toLowerCase() + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── MISC ──────────────────────────────────────────────────────────────────
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}
function setSync(cls, text) { const s = document.getElementById('sync'); s.className = 'sync ' + cls; s.lastChild.textContent = text; }

function renderAll() {
  renderHeader();
  if (ui.tab === 'score') renderScore();
  if (ui.tab === 'board') renderBoard();
  if (ui.tab === 'players') renderPlayers();
  if (ui.tab === 'setup') renderSetup();
}
function goTab(tab) {
  ui.tab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'scr-' + tab));
  stationKey = '';
  renderAll();
  window.scrollTo(0, 0);
}

// ── EVENTS ────────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-player], .modal-bg');
  if (!t) return;
  if (t.id === 'modal-bg') { if (e.target === t) closeModal(); return; }
  if (t.dataset.tab) return goTab(t.dataset.tab);
  if (t.dataset.goto) return goTab(t.dataset.goto);
  if (t.dataset.skill) { ui.skill = t.dataset.skill; stationKey = ''; return renderScore(); }
  if (t.dataset.bskill) { ui.boardSkill = t.dataset.bskill; return renderBoard(); }
  if (t.dataset.step) {
    const pid = t.dataset.pid, sess = ensureSession();
    const cur = getScore(sess, pid, ui.skill);
    const d = +t.dataset.step;
    return setScore(pid, cur === null ? (d > 0 ? 1 : 0) : Math.max(0, cur + d));
  }
  if (t.dataset.timer) return toggleTimer(t.dataset.timer);
  if (t.dataset.player) return openPlayer(t.dataset.player);
  if (t.hasAttribute('data-close')) return closeModal();
  if (t.dataset.current) { put('current', t.dataset.current); stationKey = ''; renderAll(); return toast('Current day changed'); }
  if (t.dataset.editSess) return editSession(t.dataset.editSess);

  switch (t.id) {
    case 'new-session-btn':
    case 'new-session-btn2': {
      const n = Object.keys(state.sessions).length + 1;
      const name = prompt('Name this challenge day:', 'Challenge Day ' + n);
      if (name === null) return;
      createSession(name.trim() || undefined);
      ui.boardSession = state.current; stationKey = '';
      renderAll(); return toast('New challenge day started');
    }
    case 'add-btn': {
      const inp = document.getElementById('add-name');
      const n = addPlayers(inp.value);
      inp.value = ''; inp.focus();
      renderAll(); if (n) toast(n === 1 ? 'Kid added' : n + ' kids added'); return;
    }
    case 'import-btn': return importRoster();
    case 'save-player': {
      const pid = t.dataset.pid;
      const name = document.getElementById('edit-name').value.trim();
      if (!name) return toast('Name can’t be empty');
      put(`players/${pid}/name`, name.slice(0, 40));
      put(`players/${pid}/number`, document.getElementById('edit-num').value.trim().slice(0, 4));
      closeModal(); renderAll(); return toast('Saved');
    }
    case 'del-player': {
      const pid = t.dataset.pid;
      if (!confirm(`Remove ${state.players[pid].name} and all their scores?`)) return;
      Object.keys(state.scores).forEach(sid => { if (state.scores[sid]?.[pid]) put(`scores/${sid}/${pid}`, null); });
      put('players/' + pid, null);
      closeModal(); renderAll(); return toast('Removed');
    }
    case 'save-sess': {
      const sid = t.dataset.sid;
      put(`sessions/${sid}/name`, document.getElementById('sess-name').value.trim() || state.sessions[sid].name);
      put(`sessions/${sid}/date`, document.getElementById('sess-date').value || state.sessions[sid].date);
      closeModal(); renderAll(); return;
    }
    case 'del-sess': {
      const sid = t.dataset.sid;
      if (!confirm(`Delete "${state.sessions[sid].name}" and every score from that day?`)) return;
      put('scores/' + sid, null);
      put('sessions/' + sid, null);
      if (state.current === sid) { const l = sessionsSorted(); put('current', l.length ? l[l.length - 1].id : null); }
      closeModal(); renderAll(); return;
    }
    case 'csv-btn': return downloadCsv();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('score-in')) return setScore(t.dataset.pid, t.value);
  if (t.id === 'score-session') { put('current', t.value); stationKey = ''; return renderAll(); }
  if (t.id === 'board-session') { ui.boardSession = t.value; return renderBoard(); }
  if (t.id === 'event-name') { put('event', t.value.trim() || 'Skills Challenge'); return renderHeader(); }
  if (t.dataset.max) {
    const v = Math.max(1, Math.min(100, Math.round(+t.value || SK[t.dataset.max].defMax)));
    put('settings/' + t.dataset.max + 'Max', v); t.value = v; stationKey = ''; return renderAll();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'add-name') document.getElementById('add-btn').click();
  if (e.key === 'Enter' && e.target.classList.contains('score-in')) e.target.blur();
  if (e.key === 'Escape') closeModal();
});
// Select all on focus so a coach can just type over the number.
document.addEventListener('focusin', e => { if (e.target.classList.contains('score-in')) setTimeout(() => e.target.select(), 0); });

// ── FIREBASE (shared across coaches; falls back to this device only) ──────
async function importRoster() {
  if (!fb) return toast('Not connected, can’t reach the Match Tracker');
  try {
    const cur = (await fb.get(fb.ref(fb.db, 'soccer/current-season'))).val();
    const seasons = (await fb.get(fb.ref(fb.db, 'soccer/seasons'))).val() || {};
    const season = seasons[cur] || Object.values(seasons).pop();
    const roster = season && season.roster ? Object.values(season.roster) : [];
    const names = roster.map(r => typeof r === 'string' ? r : r && r.name).filter(Boolean);
    if (!names.length) return toast('No roster found in the Match Tracker');
    const n = addPlayers(names.join(','));
    renderAll();
    toast(n ? `Imported ${n} ${n === 1 ? 'kid' : 'kids'}` : 'Everyone is already here');
  } catch (e) { console.warn(e); toast('Import failed'); }
}

      authDomain:        "lunch-f7021.firebaseapp.com",
      databaseURL:       "https://lunch-f7021-default-rtdb.firebaseio.com",
      projectId:         "lunch-f7021",

      messagingSenderId: "1053755216064",
      appId:             "1:1053755216064:web:14b749200f825a4e9bdd25"
    }, 'skills-challenge');
    await signInAnonymously(getAuth(app));
    const db = dbm.getDatabase(app);
    let first = true;
    dbm.onValue(dbm.ref(db, ROOT), snap => {
      const remote = snap.val();
      if (first) {
        first = false;
        fb = { db, ref: dbm.ref, set: dbm.set, get: dbm.get };
        // Nothing in the cloud yet but this device has data: upload it.
        if (!remote && (Object.keys(state.players).length || Object.keys(state.sessions).length)) {
          dbm.set(dbm.ref(db, ROOT), JSON.parse(JSON.stringify(state)));
          return;
        }
      }
      state = normalize(remote);
      saveLocal();
      renderAll();
    }, err => { console.warn(err); setSync('off', 'This device only'); });
    dbm.onValue(dbm.ref(db, '.info/connected'), s => s.val() ? setSync('on', 'Synced') : setSync('', 'Reconnecting…'));
  } catch (e) {
    console.warn('Firebase unavailable', e);
    setSync('off', 'This device only');
  }
}
